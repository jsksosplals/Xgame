<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Xgame — идеальный код</title>
    <style>
        /* Стили (сокращённо, но с эффектом стекла) */
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#0a0a12;--bg-secondary:#12121e;--text-primary:#e8e8f0;--text-secondary:#8892b0;--accent:#7c3aed;--border-color:rgba(255,255,255,0.06);--radius:20px;--shadow:0 20px 60px rgba(0,0,0,0.5);--transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94)}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:var(--transition)}
        body.light{--bg-primary:#f0f0f5;--bg-secondary:#e8e8f0;--text-primary:#1a1a2e;--text-secondary:#4b5563;--border-color:rgba(0,0,0,0.06)}
        .glass{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(255,255,255,0.04);border:1px solid var(--border-color);border-radius:var(--radius);box-shadow:var(--shadow);transition:var(--transition)}
        .glass:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.12)}
        .btn{padding:8px 24px;border:none;border-radius:60px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:var(--transition)}
        .btn:hover{transform:scale(1.02);box-shadow:0 8px 25px rgba(124,58,237,0.25)}
        .btn-outline{background:transparent;border:1px solid var(--border-color);color:var(--text-primary)}
        .btn-outline:hover{background:rgba(255,255,255,0.05)}
        .btn-sm{padding:4px 14px;font-size:12px}
        .btn-danger{background:rgba(239,68,68,0.2);color:#ef4444}
        .btn-danger:hover{background:rgba(239,68,68,0.3)}
        #navbar{position:sticky;top:0;z-index:1000;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(10,10,18,0.85);border-bottom:1px solid var(--border-color)}
        body.light #navbar{background:rgba(240,240,245,0.85)}
        .logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap}
        .nav-links a{padding:10px 24px;border-radius:60px;color:var(--text-secondary);font-weight:600;font-size:15px;cursor:pointer;transition:var(--transition);text-decoration:none;border:1px solid transparent}
        .nav-links a.active{color:var(--text-primary);background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.3)}
        .nav-links a:hover:not(.active){background:rgba(255,255,255,0.05)}
        .nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .search-wrapper input{padding:8px 16px;border-radius:60px;border:1px solid var(--border-color);background:rgba(255,255,255,0.04);color:var(--text-primary);font-size:14px;outline:none;transition:var(--transition);width:180px}
        .search-wrapper input:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,0.15)}
        .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;cursor:pointer;overflow:hidden;flex-shrink:0;color:#fff;border:2px solid rgba(255,255,255,0.1)}
        .profile-dropdown{position:absolute;top:60px;right:0;width:280px;padding:16px;z-index:1000;animation:fadeSlide 0.25s ease;background:rgba(10,10,18,0.95);backdrop-filter:blur(20px);border:1px solid var(--border-color);border-radius:var(--radius)}
        body.light .profile-dropdown{background:rgba(240,240,245,0.95)}
        .profile-dropdown-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .profile-dropdown button{display:block;width:100%;padding:8px 12px;background:transparent;border:none;border-radius:10px;color:var(--text-primary);font-size:14px;text-align:left;cursor:pointer;transition:var(--transition)}
        .profile-dropdown button:hover{background:rgba(255,255,255,0.06)}
        .profile-dropdown .text-danger{color:#ef4444}
        .profile-dropdown .text-danger:hover{background:rgba(239,68,68,0.15)}
        .profile-dropdown-divider{height:1px;background:var(--border-color);margin:8px 0}
        #content{padding:24px 20px 100px;max-width:1200px;margin:0 auto}
        .page{display:none;animation:fadeSlide 0.3s ease}
        .page.active{display:block}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .ideas-grid{display:grid;grid-template-columns:1fr;gap:20px}
        @media(min-width:640px){.ideas-grid{grid-template-columns:1fr 1fr}}
        @media(min-width:1024px){.ideas-grid{grid-template-columns:1fr 1fr 1fr}}
        .idea-card{padding:24px}
        .idea-card .title{font-size:18px;font-weight:700;margin-bottom:6px}
        .idea-card .meta{font-size:13px;color:var(--text-secondary);display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
        .idea-card .desc{color:var(--text-secondary);font-size:14px;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .reactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-color)}
        .reaction-btn{padding:6px 16px;border-radius:40px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);cursor:pointer;transition:var(--transition);font-size:14px;font-weight:600}
        .reaction-btn.active{background:rgba(124,58,237,0.15);border-color:#7c3aed;color:var(--text-primary)}
        .reaction-btn:hover{background:rgba(255,255,255,0.05)}
        .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .filters .btn{padding:6px 18px;font-size:13px;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary)}
        .filters .btn.active{background:rgba(124,58,237,0.15);border-color:#7c3aed;color:var(--text-primary)}
        .sandbox{margin-top:12px;border:1px solid var(--border-color);border-radius:16px;padding:16px;background:rgba(0,0,0,0.2)}
        .sandbox textarea{width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid var(--border-color);color:var(--text-primary);font-family:'Courier New',monospace;font-size:13px;resize:vertical;min-height:60px}
        body.light .sandbox textarea{background:rgba(0,0,0,0.04)}
        .sandbox iframe{width:100%;min-height:200px;border-radius:12px;background:#fff;margin-top:8px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.open{display:flex}
        .modal{background:rgba(20,20,30,0.96);backdrop-filter:blur(30px);border:1px solid var(--border-color);border-radius:var(--radius);padding:32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:fadeSlide 0.25s ease}
        body.light .modal{background:rgba(240,240,245,0.96)}
        .modal h2{font-size:24px;margin-bottom:20px}
        .modal input,.modal textarea{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--border-color);background:rgba(255,255,255,0.04);color:var(--text-primary);font-size:15px;outline:none;transition:var(--transition)}
        body.light .modal input,body.light .modal textarea{background:#fff;color:#1a1a2e}
        .modal input:focus,.modal textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,0.15)}
        .modal .form-group{margin-bottom:16px}
        .modal .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
        .modal .btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
        .fab{position:fixed;bottom:28px;right:28px;z-index:999;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;color:#fff;font-size:34px;box-shadow:0 12px 40px rgba(124,58,237,0.4);cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center}
        .fab:hover{transform:scale(1.05);box-shadow:0 16px 50px rgba(124,58,237,0.5)}
        .loader{text-align:center;padding:20px;color:var(--text-secondary)}
        .hidden{display:none!important}
        .profile-stats{display:flex;gap:20px;margin:12px 0;flex-wrap:wrap}
        .profile-stats span{font-size:14px;color:var(--text-secondary)}
        .history-list{max-height:300px;overflow-y:auto;margin:12px 0}
        .history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border-color)}
        .settings-group{margin-bottom:20px}
        .settings-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
        .settings-toggle{display:flex;gap:6px}
        .settings-toggle button{padding:6px 16px;border:1px solid var(--border-color);border-radius:60px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:var(--transition)}
        .settings-toggle button.active{background:rgba(124,58,237,0.15);border-color:#7c3aed;color:var(--text-primary)}
        .post-card{padding:24px;margin-bottom:20px}
        .post-card .content{white-space:pre-wrap;color:var(--text-secondary);margin:12px 0;font-size:15px;line-height:1.6}
        .post-card img{max-width:100%;border-radius:16px;margin-top:12px}
        @media(max-width:480px){#navbar{padding:10px 16px;gap:8px}.logo{font-size:20px}.nav-links a{padding:6px 14px;font-size:13px}.search-wrapper input{width:120px}.idea-card{padding:16px}.modal{padding:20px}.fab{width:48px;height:48px;font-size:26px;bottom:16px;right:16px}}
    </style>
</head>
<body>

    <!-- =================================================================
    НАВБАР
    ================================================================= -->
    <nav id="navbar">
        <div class="logo">Xgame</div>
        <div class="nav-links">
            <a data-page="ideas" class="active">Идеи</a>
            <a data-page="posts">Посты</a>
            <a data-page="about">О нас</a>
        </div>
        <div class="nav-right">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск">
            </div>
            <div id="authBlock">
                <button class="btn btn-sm btn-outline" id="loginBtn">Войти</button>
                <button class="btn btn-sm" id="registerBtn">Регистрация</button>
            </div>
            <div id="profileBlock" class="hidden" style="position:relative;">
                <div class="avatar" id="avatarBtn">
                    <span id="avatarText">U</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- =================================================================
    КОНТЕНТ
    ================================================================= -->
    <div id="content">
        <div id="page-ideas" class="page active">
            <div class="filters" id="filtersContainer">
                <button class="btn active" data-filter="newest">Новые</button>
                <button class="btn" data-filter="popular">Популярные</button>
                <button class="btn" data-filter="views">По просмотрам</button>
            </div>
            <div id="ideasContainer" class="ideas-grid"></div>
            <div id="ideasLoader" class="loader">Загрузка...</div>
        </div>
        <div id="page-posts" class="page">
            <h2 style="font-size:26px;margin-bottom:20px;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Посты</h2>
            <div id="postsContainer"></div>
            <div id="postsLoader" class="loader">Загрузка...</div>
        </div>
        <div id="page-about" class="page">
            <div class="glass" style="padding:32px;">
                <h2 style="font-size:26px;margin-bottom:16px;">О проекте</h2>
                <p style="color:var(--text-secondary);line-height:1.7;font-size:15px;">
                    <strong>Xgame</strong> — платформа для обмена идеями и новостями в сфере кода.<br>
                    Здесь разработчики делятся идеями, публикуют посты и общаются.
                </p>
                <div style="margin-top:20px;display:flex;gap:20px;flex-wrap:wrap;">
                    <a href="#" style="color:#7c3aed;">Twitter</a>
                    <a href="#" style="color:#7c3aed;">Telegram</a>
                    <a href="#" style="color:#7c3aed;">YouTube</a>
                </div>
                <div style="margin-top:16px;display:flex;gap:16px;font-size:14px;color:var(--text-secondary);">
                    <a href="#" style="color:var(--text-secondary);">Конфиденциальность</a>
                    <a href="#" style="color:var(--text-secondary);">Правила</a>
                </div>
            </div>
        </div>
    </div>

    <!-- =================================================================
    FAB
    ================================================================= -->
    <button id="fabBtn" class="fab">+</button>

    <!-- =================================================================
    МОДАЛКИ
    ================================================================= -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <h2 id="authModalTitle">Вход</h2>
            <div class="form-group">
                <label>Email</label>
                <input id="authEmail" type="email" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input id="authPassword" type="password" placeholder="••••••••">
            </div>
            <div id="authNicknameGroup" class="form-group hidden">
                <label>Никнейм</label>
                <input id="authNickname" placeholder="Ваш никнейм">
            </div>
            <div id="authError" style="color:#ef4444;font-size:14px;margin-bottom:12px;display:none;"></div>
            <div class="btn-row">
                <button class="btn btn-outline" id="authCancelBtn">Отмена</button>
                <button class="btn" id="authSubmitBtn">Войти</button>
            </div>
            <div style="margin-top:12px;text-align:center;font-size:14px;color:var(--text-secondary);">
                <span id="authToggleText">Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a></span>
            </div>
        </div>
    </div>

    <!-- =================================================================
    СКРИПТЫ
    ================================================================= -->
    <script type="module">
        // =================================================================
        // 1. ИМПОРТЫ
        // =================================================================
        import { APP_CONFIG } from './src/app/app-config.js';
        import { store } from './src/core/state-manager/state-manager.js';
        import { eventBus } from './src/core/event-bus/event-bus.js';
        import { EVENTS } from './src/core/event-bus/event-types.js';
        import { authService } from './src/domain/auth/auth.service.js';
        import { ideasService } from './src/domain/ideas/ideas.service.js';
        import { postsService } from './src/domain/posts/posts.service.js';
        import { profileService } from './src/domain/profile/profile.service.js';
        import { sandboxService } from './src/domain/sandbox/sandbox.service.js';
        import { settingsService } from './src/domain/settings/settings.service.js';
        import { themeManager } from './src/ui/theme/theme-manager.js';
        import { renderProfileDropdown } from './src/ui/components/profile/profile-dropdown.js';
        import { renderSandboxHistory } from './src/ui/components/sandbox/sandbox-history.js';

        // =================================================================
        // 2. DOM-ЭЛЕМЕНТЫ
        // =================================================================
        const DOM = {
            content: document.getElementById('content'),
            ideasContainer: document.getElementById('ideasContainer'),
            ideasLoader: document.getElementById('ideasLoader'),
            postsContainer: document.getElementById('postsContainer'),
            postsLoader: document.getElementById('postsLoader'),
            searchInput: document.getElementById('searchInput'),
            filtersContainer: document.getElementById('filtersContainer'),
            authBlock: document.getElementById('authBlock'),
            profileBlock: document.getElementById('profileBlock'),
            avatarBtn: document.getElementById('avatarBtn'),
            avatarText: document.getElementById('avatarText'),
            loginBtn: document.getElementById('loginBtn'),
            registerBtn: document.getElementById('registerBtn'),
            fabBtn: document.getElementById('fabBtn'),
            authModal: document.getElementById('authModal'),
            authModalTitle: document.getElementById('authModalTitle'),
            authEmail: document.getElementById('authEmail'),
            authPassword: document.getElementById('authPassword'),
            authNickname: document.getElementById('authNickname'),
            authNicknameGroup: document.getElementById('authNicknameGroup'),
            authError: document.getElementById('authError'),
            authSubmitBtn: document.getElementById('authSubmitBtn'),
            authCancelBtn: document.getElementById('authCancelBtn'),
            authToggleLink: document.getElementById('authToggleLink'),
            authToggleText: document.getElementById('authToggleText'),
            navLinks: document.querySelectorAll('.nav-links a'),
        };

        // =================================================================
        // 3. РЕНДЕРИНГ
        // =================================================================
        function renderIdeas(ideas) {
            if (!ideas || ideas.length === 0) {
                DOM.ideasContainer.innerHTML = `
                    <div class="glass" style="padding:40px;text-align:center;grid-column:1/-1;">
                        <p style="font-size:40px;margin-bottom:8px;">💡</p>
                        <p style="color:var(--text-secondary);">Нет идей. Будь первым!</p>
                    </div>
                `;
                return;
            }

            DOM.ideasContainer.innerHTML = ideas.map(idea => {
                const reactions = idea.reactions || [];
                const reactionCounts = {};
                reactions.forEach(r => {
                    reactionCounts[r.reaction_type] = (reactionCounts[r.reaction_type] || 0) + 1;
                });

                return `
                    <div class="glass idea-card" data-id="${idea.id}">
                        <div class="title">${escapeHtml(idea.title)}</div>
                        <div class="meta">
                            <span>by ${idea.profiles?.nickname || 'Аноним'}</span>
                            <span>${new Date(idea.created_at).toLocaleDateString()}</span>
                            <span style="margin-left:auto;">👁️ ${idea.views || 0}</span>
                        </div>
                        ${idea.description ? `<div class="desc">${escapeHtml(idea.description)}</div>` : ''}
                        <button class="btn btn-outline btn-sm" data-toggle-sandbox="${idea.id}">▶ Песочница</button>
                        <div class="sandbox hidden" id="sandbox-${idea.id}">
                            <div style="display:grid;gap:8px;">
                                <textarea data-sandbox-html="${idea.id}" rows="2">${escapeHtml(idea.code_html || '')}</textarea>
                                <textarea data-sandbox-css="${idea.id}" rows="2">${escapeHtml(idea.code_css || '')}</textarea>
                                <textarea data-sandbox-js="${idea.id}" rows="2">${escapeHtml(idea.code_js || '')}</textarea>
                                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                    <button class="btn btn-sm" data-run-sandbox="${idea.id}">▶ Запустить</button>
                                    <button class="btn btn-outline btn-sm" data-save-sandbox="${idea.id}">💾 Сохранить</button>
                                    <button class="btn btn-outline btn-sm" data-history-sandbox="${idea.id}">📜 История</button>
                                </div>
                                <iframe id="sandbox-frame-${idea.id}"></iframe>
                            </div>
                        </div>
                        <div class="reactions">
                            ${['👍','👎','❤','🚀','💡'].map(type => `
                                <button class="reaction-btn ${reactions.some(r => r.reaction_type === type && r.user_id === store.get('user')?.id) ? 'active' : ''}"
                                        data-reaction="${type}" data-target="idea" data-id="${idea.id}">
                                    ${type} ${reactionCounts[type] || 0}
                                </button>
                            `).join('')}
                            <button class="reaction-btn" data-report="idea" data-id="${idea.id}">🚩</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPosts(posts) {
            if (!posts || posts.length === 0) {
                DOM.postsContainer.innerHTML = `
                    <div class="glass" style="padding:40px;text-align:center;">
                        <p style="font-size:40px;margin-bottom:8px;">📭</p>
                        <p style="color:var(--text-secondary);">Пока нет постов</p>
                    </div>
                `;
                return;
            }

            DOM.postsContainer.innerHTML = posts.map(post => `
                <div class="glass post-card">
                    <h2 style="font-size:22px;font-weight:700;">${escapeHtml(post.title)}</h2>
                    <div style="display:flex;gap:12px;font-size:13px;color:var(--text-secondary);margin:4px 0 12px;">
                        <span>by ${post.profiles?.nickname || 'Admin'}</span>
                        <span>${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="content">${escapeHtml(post.content)}</div>
                    ${post.image_url ? `<img src="${post.image_url}" alt="${escapeHtml(post.title)}">` : ''}
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =================================================================
        // 4. ЗАГРУЗКА ДАННЫХ
        // =================================================================
        async function loadIdeas(reset = false) {
            if (reset) {
                store.setState({ ideas: [], ideaOffset: 0, hasMoreIdeas: true });
            }
            const state = store.getState();
            if (!state.hasMoreIdeas) return;

            DOM.ideasLoader.textContent = 'Загрузка...';
            try {
                const { data, error } = await supabaseAdapter
                    .from('ideas')
                    .select('*, profiles:user_id (username,nickname,avatar_url)')
                    .order(state.sort === 'newest' ? 'created_at' : 'views', { ascending: false })
                    .range(state.ideaOffset, state.ideaOffset + 9);

                if (error) throw error;
                if (data.length < 10) store.setState({ hasMoreIdeas: false });

                const ideas = reset ? data : [...state.ideas, ...data];
                store.setState({ ideas, ideaOffset: state.ideaOffset + data.length });
                renderIdeas(ideas);
                DOM.ideasLoader.textContent = state.hasMoreIdeas ? 'Загрузить ещё' : '🎉 Все идеи загружены';
            } catch (error) {
                console.error('Ошибка загрузки идей:', error);
                DOM.ideasLoader.textContent = '❌ ' + error.message;
            }
        }

        async function loadPosts(reset = false) {
            if (reset) {
                store.setState({ posts: [], postOffset: 0, hasMorePosts: true });
            }
            const state = store.getState();
            if (!state.hasMorePosts) return;

            DOM.postsLoader.textContent = 'Загрузка...';
            try {
                const { data, error } = await supabaseAdapter
                    .from('posts')
                    .select('*, profiles:author_id (username,nickname,avatar_url)')
                    .order('created_at', { ascending: false })
                    .range(state.postOffset, state.postOffset + 9);

                if (error) throw error;
                if (data.length < 10) store.setState({ hasMorePosts: false });

                const posts = reset ? data : [...state.posts, ...data];
                store.setState({ posts, postOffset: state.postOffset + data.length });
                renderPosts(posts);
                DOM.postsLoader.textContent = state.hasMorePosts ? 'Загрузить ещё' : '🎉 Все посты загружены';
            } catch (error) {
                console.error('Ошибка загрузки постов:', error);
                DOM.postsLoader.textContent = '❌ ' + error.message;
            }
        }

        // =================================================================
        // 5. НАВИГАЦИЯ
        // =================================================================
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            DOM.navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });
            store.setState({ currentPage: page });
        }

        // =================================================================
        // 6. ОБРАБОТЧИКИ
        // =================================================================
        async function initApp() {
            // Проверяем сессию
            const user = await authService.restoreSession();
            if (user) {
                DOM.authBlock.classList.add('hidden');
                DOM.profileBlock.classList.remove('hidden');
                DOM.avatarText.textContent = user.user_metadata?.nickname?.charAt(0) || 'U';
                await profileService.loadProfile(user.id);
            }

            // Загружаем данные
            await loadIdeas(true);
            await loadPosts(true);

            // Тема
            themeManager.applyTheme();

            // ===== НАВИГАЦИЯ =====
            DOM.navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const page = link.dataset.page;
                    navigateTo(page);
                    if (page === 'ideas') loadIdeas(true);
                    if (page === 'posts') loadPosts(true);
                });
            });

            // ===== ПОИСК =====
            DOM.searchInput.addEventListener('input', () => {
                const search = DOM.searchInput.value.trim();
                if (search.length >= 2) {
                    // Поиск через Supabase
                    loadIdeas(true);
                } else if (search.length === 0) {
                    loadIdeas(true);
                }
            });

            // ===== ФИЛЬТРЫ =====
            DOM.filtersContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn');
                if (!btn) return;
                DOM.filtersContainer.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                store.setState({ sort: btn.dataset.filter });
                loadIdeas(true);
            });

            // ===== АВТОРИЗАЦИЯ =====
            DOM.loginBtn.addEventListener('click', () => {
                DOM.authModalTitle.textContent = 'Вход';
                DOM.authSubmitBtn.textContent = 'Войти';
                DOM.authNicknameGroup.classList.add('hidden');
                DOM.authToggleText.innerHTML = 'Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a>';
                DOM.authModal.classList.add('open');
            });

            DOM.registerBtn.addEventListener('click', () => {
                DOM.authModalTitle.textContent = 'Регистрация';
                DOM.authSubmitBtn.textContent = 'Зарегистрироваться';
                DOM.authNicknameGroup.classList.remove('hidden');
                DOM.authToggleText.innerHTML = 'Уже есть аккаунт? <a href="#" id="authToggleLink" style="color:#7c3aed;">Войти</a>';
                DOM.authModal.classList.add('open');
            });

            DOM.authCancelBtn.addEventListener('click', () => {
                DOM.authModal.classList.remove('open');
                DOM.authError.style.display = 'none';
            });

            DOM.authModal.addEventListener('click', (e) => {
                if (e.target === DOM.authModal) {
                    DOM.authModal.classList.remove('open');
                    DOM.authError.style.display = 'none';
                }
            });

            DOM.authToggleLink.addEventListener('click', (e) => {
                e.preventDefault();
                const isLogin = DOM.authModalTitle.textContent === 'Вход';
                if (isLogin) {
                    DOM.authModalTitle.textContent = 'Регистрация';
                    DOM.authSubmitBtn.textContent = 'Зарегистрироваться';
                    DOM.authNicknameGroup.classList.remove('hidden');
                    DOM.authToggleText.innerHTML = 'Уже есть аккаунт? <a href="#" id="authToggleLink" style="color:#7c3aed;">Войти</a>';
                } else {
                    DOM.authModalTitle.textContent = 'Вход';
                    DOM.authSubmitBtn.textContent = 'Войти';
                    DOM.authNicknameGroup.classList.add('hidden');
                    DOM.authToggleText.innerHTML = 'Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a>';
                }
                DOM.authError.style.display = 'none';
                DOM.authEmail.value = '';
                DOM.authPassword.value = '';
                DOM.authNickname.value = '';
            });

            DOM.authSubmitBtn.addEventListener('click', async () => {
                const email = DOM.authEmail.value.trim();
                const password = DOM.authPassword.value.trim();
                const nickname = DOM.authNickname.value.trim();

                if (!email || !password) {
                    DOM.authError.textContent = 'Заполните все поля';
                    DOM.authError.style.display = 'block';
                    return;
                }

                if (DOM.authModalTitle.textContent === 'Регистрация' && !nickname) {
                    DOM.authError.textContent = 'Введите никнейм';
                    DOM.authError.style.display = 'block';
                    return;
                }

                try {
                    let user;
                    if (DOM.authModalTitle.textContent === 'Вход') {
                        user = await authService.login(email, password);
                    } else {
                        user = await authService.register(email, password, nickname);
                    }

                    DOM.authModal.classList.remove('open');
                    DOM.authError.style.display = 'none';
                    DOM.authBlock.classList.add('hidden');
                    DOM.profileBlock.classList.remove('hidden');
                    DOM.avatarText.textContent = user.user_metadata?.nickname?.charAt(0) || 'U';
                    await profileService.loadProfile(user.id);
                } catch (error) {
                    DOM.authError.textContent = error.message || 'Ошибка авторизации';
                    DOM.authError.style.display = 'block';
                }
            });

            // ===== ПРОФИЛЬ (АВАТАР) =====
            DOM.avatarBtn.addEventListener('click', () => {
                const existing = document.querySelector('.profile-dropdown');
                if (existing) {
                    existing.remove();
                    return;
                }
                const dropdown = renderProfileDropdown(DOM.avatarBtn);
                DOM.avatarBtn.parentElement.appendChild(dropdown);
                document.addEventListener('click', function closeDropdown(e) {
                    if (!e.target.closest('.profile-dropdown') && !e.target.closest('#avatarBtn')) {
                        dropdown.remove();
                        document.removeEventListener('click', closeDropdown);
                    }
                });
            });

            // ===== FAB =====
            DOM.fabBtn.addEventListener('click', () => {
                alert('Функция добавления идей в разработке!');
            });

            // ===== ПЕСОЧНИЦА (делегирование) =====
            document.addEventListener('click', (e) => {
                // Toggle sandbox
                const toggleBtn = e.target.closest('[data-toggle-sandbox]');
                if (toggleBtn) {
                    const id = toggleBtn.dataset.toggleSandbox;
                    document.getElementById(`sandbox-${id}`).classList.toggle('hidden');
                }

                // Run sandbox
                const runBtn = e.target.closest('[data-run-sandbox]');
                if (runBtn) {
                    const id = runBtn.dataset.runSandbox;
                    const html = document.querySelector(`[data-sandbox-html="${id}"]`).value;
                    const css = document.querySelector(`[data-sandbox-css="${id}"]`).value;
                    const js = document.querySelector(`[data-sandbox-js="${id}"]`).value;
                    const frame = document.getElementById(`sandbox-frame-${id}`);
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    if (doc) {
                        doc.open();
                        doc.write(`
                            <html>
                                <head><style>${css}</style></head>
                                <body>${html}</body>
                                <script>${js}<\/script>
                            </html>
                        `);
                        doc.close();
                    }
                }

                // Save sandbox
                const saveBtn = e.target.closest('[data-save-sandbox]');
                if (saveBtn) {
                    const id = saveBtn.dataset.saveSandbox;
                    const html = document.querySelector(`[data-sandbox-html="${id}"]`).value;
                    const css = document.querySelector(`[data-sandbox-css="${id}"]`).value;
                    const js = document.querySelector(`[data-sandbox-js="${id}"]`).value;
                    sandboxService.saveVersion(id, html, css, js);
                    alert('✅ Версия сохранена в историю!');
                }

                // History sandbox
                const historyBtn = e.target.closest('[data-history-sandbox]');
                if (historyBtn) {
                    const id = historyBtn.dataset.historySandbox;
                    renderSandboxHistory(id);
                }

                // Reactions
                const reactionBtn = e.target.closest('[data-reaction]');
                if (reactionBtn) {
                    const type = reactionBtn.dataset.reaction;
                    const id = reactionBtn.dataset.id;
                    // Полная логика реакций здесь
                    alert(`Реакция "${type}" для идеи ${id} (заглушка)`);
                }

                // Report
                const reportBtn = e.target.closest('[data-report]');
                if (reportBtn) {
                    const id = reportBtn.dataset.id;
                    const reason = prompt('Причина жалобы:');
                    if (reason) {
                        alert(`🚩 Жалоба на идею ${id} отправлена`);
                    }
                }
            });

            // ===== ЗАГРУЗКА ЕЩЁ =====
            DOM.ideasLoader.addEventListener('click', () => loadIdeas(false));
            DOM.postsLoader.addEventListener('click', () => loadPosts(false));

            console.log('✅ Xgame инициализирован!');
        }

        // =================================================================
        // 7. ЗАПУСК
        // =================================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
