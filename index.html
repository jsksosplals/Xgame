<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Xgame</title>
  <style>
    /* ============================================================
       ВСЕ СТИЛИ
       ============================================================ */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    :root{--bg:#0a0a0f;--card:#12121a;--border:rgba(255,255,255,0.06);--text:#fff;--muted:#8888aa;--accent:#6c5ce7;--danger:#ff6b6b;--success:#51cf66;--radius:20px}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:16px;max-width:600px;margin:0 auto;min-height:100vh;overflow-x:hidden}
    #auth-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:200;padding:20px}
    .auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px 28px;max-width:360px;width:100%;text-align:center}
    .auth-card .logo{display:flex;justify-content:center;align-items:center;gap:4px;margin-bottom:12px}
    .auth-card .logo-x{font-size:32px;font-weight:900;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .auth-card .logo-text{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
    .auth-card h3{font-size:20px;margin-bottom:4px}
    .auth-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
    .auth-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#6c5ce7,#7d6ff0);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;text-align:center;transition:.3s;font-family:inherit;box-shadow:0 4px 16px rgba(108,92,231,0.3);cursor:pointer}
    .auth-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(108,92,231,0.4);background:linear-gradient(135deg,#7d6ff0,#8d7ff5)}
    .auth-error{color:var(--danger);font-size:12px;margin-top:12px;display:none}
    .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:24px;border:1px solid var(--border);margin-bottom:16px}
    .logo{display:flex;align-items:center;gap:4px}
    .logo-x{font-size:32px;font-weight:900;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .logo-text{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
    .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.03);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:14px;color:var(--muted)}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .nav{display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:16px;padding:4px;border:1px solid var(--border);margin-bottom:16px}
    .nav button{flex:1;padding:10px 8px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:500;border-radius:12px;cursor:pointer;font-family:inherit;transition:.3s}
    .nav button:hover{color:var(--text);background:rgba(255,255,255,0.03)}
    .nav button.active{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(108,92,231,0.3)}
    .page{display:none;animation:fadeIn .3s ease}
    .page.active{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .search{display:flex;gap:8px;margin-bottom:16px;background:rgba(255,255,255,0.03);border-radius:16px;padding:6px;border:1px solid var(--border)}
    .search input{flex:1;background:transparent;border:none;padding:8px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
    .search input::placeholder{color:var(--muted)}
    .search button{background:var(--accent);border:none;padding:8px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
    .grid{display:grid;gap:12px}
    .post-card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);margin-bottom:20px}
    .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .post-author{display:flex;align-items:center;gap:10px}
    .post-author img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border);pointer-events:none}
    .post-author .name{font-weight:600;font-size:14px}
    .post-author .username{font-size:12px;color:var(--muted)}
    .post-date{font-size:11px;color:var(--muted)}
    .post-title{font-size:22px;font-weight:700;margin-bottom:8px;line-height:1.3}
    .post-text{font-size:15px;color:#ccccdd;line-height:1.7;margin-bottom:14px;white-space:pre-wrap}
    .post-image{width:100%;border-radius:12px;margin-bottom:14px;max-height:400px;object-fit:cover}
    .reactions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px}
    .reaction-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:30px;padding:6px 14px 6px 10px;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit;-webkit-tap-highlight-color:transparent}
    .reaction-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12)}
    .reaction-btn:active{transform:scale(.95)}
    .reaction-btn .emoji{font-size:18px;line-height:1;pointer-events:none}
    .reaction-btn .count{font-size:12px;font-weight:600;min-width:8px;pointer-events:none}
    .reaction-btn.active{background:rgba(108,92,231,0.15);border-color:var(--accent);color:var(--text)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .reaction-btn.shake{animation:shake .3s ease;border-color:var(--danger)!important}
    .reaction-limit-text{font-size:11px;color:var(--muted);margin-left:auto;padding:4px 8px;background:rgba(255,255,255,0.02);border-radius:12px}
    .post-stats{display:flex;gap:16px;align-items:center;padding-bottom:12px;font-size:13px;color:var(--muted)}
    .post-stats .views{display:flex;align-items:center;gap:4px}
    .post-stats .views svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .comment-button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;margin-top:4px;-webkit-tap-highlight-color:transparent}
    .comment-button:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
    .comment-button:active{transform:scale(.98)}
    .comment-button .badge{background:var(--accent);color:#fff;border-radius:30px;padding:2px 12px;font-size:13px;font-weight:700;min-width:28px;text-align:center}
    .comments-section{margin-top:16px;display:none}
    .comments-section.open{display:block;animation:fadeIn .3s ease}
    .comments-title{font-size:16px;font-weight:600;margin-bottom:12px}
    .comment-form{background:rgba(255,255,255,0.02);border-radius:14px;padding:12px;border:1px solid var(--border);margin-bottom:16px}
    .comment-form textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:13px;font-family:inherit;resize:vertical;min-height:44px;outline:none;padding:4px 0;user-select:text;-webkit-user-select:text}
    .comment-form textarea::placeholder{color:var(--muted)}
    .comment-form .form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .btn-submit{background:var(--accent);border:none;color:#fff;padding:6px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
    .btn-submit:hover{background:#7d6ff0}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed}
    .comment-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
    .comment-item:last-child{border-bottom:none}
    .comment-item .comment-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .comment-item .comment-header img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border);pointer-events:none}
    .comment-item .comment-header .name{font-size:13px;font-weight:600}
    .comment-item .comment-header .username{font-size:11px;color:var(--muted)}
    .comment-item .comment-header .date{font-size:10px;color:var(--muted);margin-left:auto}
    .comment-item .comment-body{font-size:13px;color:#ccccdd;line-height:1.5;padding-left:36px;word-wrap:break-word;user-select:text;-webkit-user-select:text}
    .comment-item .comment-actions{display:flex;gap:12px;padding-left:36px;margin-top:4px}
    .comment-item .comment-actions button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
    .comment-item .comment-actions button:hover{color:var(--text)}
    .comment-item .comment-actions .delete{color:var(--danger);opacity:.5}
    .comment-item .comment-actions .delete:hover{opacity:1}
    .comment-children{margin-left:20px;padding-left:12px;border-left:2px solid rgba(255,255,255,0.06)}
    .empty-comments{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
    .card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);transition:.3s;cursor:pointer}
    .card:hover{border-color:rgba(108,92,231,0.2);transform:translateY(-2px)}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .card-author{display:flex;align-items:center;gap:8px}
    .card-author img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .card-author .user{font-size:11px;color:var(--muted);cursor:pointer}
    .card-author .user:hover{color:var(--accent)}
    .card-title{font-size:18px;font-weight:700;margin-bottom:8px;word-wrap:break-word;overflow-wrap:break-word;max-width:100%}
    .card-text{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px;white-space:pre-wrap}
    .card-actions{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
    .card-actions button{background:transparent;border:none;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:4px}
    .card-actions button:hover{background:rgba(255,255,255,0.03);color:var(--text)}
    .card-actions .del{color:var(--danger);opacity:.5}
    .card-actions .del:hover{opacity:1;background:rgba(255,107,107,0.1)}
    .card-actions .run{color:var(--success);opacity:.7}
    .card-actions .run:hover{opacity:1;background:rgba(81,207,102,0.1)}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .tag{padding:4px 10px;border-radius:12px;font-size:9px;background:rgba(255,255,255,0.03);color:var(--muted);border:1px solid var(--border);cursor:pointer}
    .tag.active{background:var(--accent);color:#fff}
    .code-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:8px;background:rgba(81,207,102,0.15);color:var(--success);border:1px solid rgba(81,207,102,0.2);margin-bottom:8px}
    .edit-btn,.delete-btn{background:transparent;border:none;padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
    .edit-btn{color:var(--accent);opacity:.6}
    .edit-btn:hover{opacity:1;background:rgba(108,92,231,0.1)}
    .delete-btn{color:var(--danger);opacity:.5}
    .delete-btn:hover{opacity:1;background:rgba(255,107,107,0.1)}
    .profile-header{text-align:center;padding:20px 0}
    .profile-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;background:rgba(255,255,255,0.03);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
    .profile-avatar img{width:100%;height:100%;object-fit:cover}
    .profile-name{font-size:22px;font-weight:700}
    .profile-user{font-size:13px;color:var(--muted);margin-top:4px}
    .profile-stats{display:flex;justify-content:center;gap:32px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:16px 0}
    .profile-stat{text-align:center}
    .profile-stat .num{font-size:20px;font-weight:700;display:block}
    .profile-stat .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .logout-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,107,107,0.2);background:transparent;color:var(--danger);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px}
    .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a29bfe);border:none;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 24px rgba(108,92,231,0.4);transition:.3s;z-index:50;display:flex;align-items:center;justify-content:center}
    .fab:hover{transform:scale(1.1) rotate(90deg)}
    .fab.hidden{transform:scale(0)}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);z-index:100;justify-content:center;align-items:center;padding:20px}
    .modal.active{display:flex}
    .modal-box{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:28px 24px;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
    .modal-box h3{font-size:20px;font-weight:700;margin-bottom:16px}
    .modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:10px}
    .modal-box textarea{min-height:100px;resize:vertical}
    .modal-actions{display:flex;gap:8px;margin-top:10px}
    .modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
    .modal-btn.cancel{background:rgba(255,255,255,0.03);color:var(--muted)}
    .modal-btn.cancel:hover{background:rgba(255,255,255,0.08)}
    .modal-btn.save{background:var(--accent);color:#fff}
    .modal-btn.save:hover{background:#7d6ff0}
    .sandbox-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:150;padding:20px;flex-direction:column}
    .sandbox-overlay.active{display:flex}
    .sandbox-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-radius:16px;border:1px solid var(--border);margin-bottom:16px}
    .sandbox-header h3{font-size:16px;color:var(--text)}
    .sandbox-close{background:transparent;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:4px 12px;border-radius:8px;transition:.3s}
    .sandbox-close:hover{background:rgba(255,255,255,0.05);color:var(--text)}
    .sandbox-frame{flex:1;background:#fff;border-radius:16px;overflow:hidden}
    .sandbox-frame iframe{width:100%;height:100%;border:none;background:#fff}
    .empty{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty .icon{font-size:48px;margin-bottom:12px;opacity:.3}
    .empty h4{font-size:16px;color:var(--text-secondary);margin-bottom:4px}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:10px 24px;border-radius:14px;border:1px solid var(--border);font-size:13px;z-index:9999;max-width:90%;text-align:center;animation:fadeIn .3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.5);pointer-events:none}
    .toast.error{border-color:var(--danger)}
    .toast.success{border-color:var(--success)}
    .toast.hidden{display:none}
    @media(max-width:480px){.post-title{font-size:18px}.post-text{font-size:14px}.comment-item .comment-body{padding-left:0}.comment-item .comment-actions{padding-left:0}.comment-children{margin-left:8px;padding-left:8px}.reaction-btn{font-size:12px;padding:4px 10px 4px 8px}.reaction-btn .emoji{font-size:15px}.reaction-limit-text{font-size:9px;padding:2px 6px}.profile-stats{gap:16px}.profile-stat .num{font-size:18px}}
    @media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  </style>
</head>
<body>

  <div id="app">
    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-screen">
      <div class="auth-card">
        <div class="logo"><span class="logo-x">X</span><span class="logo-text">game</span></div>
        <h3>Добро пожаловать</h3>
        <p>Войдите через XAMChat чтобы пользоваться сайтом</p>
        <button class="auth-btn" id="authBtn">🚀 Войти через XAMChat</button>
        <div class="auth-error" id="authError">⚠️ Ошибка авторизации</div>
      </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="main-content" style="display:none;">
      <header class="header">
        <div class="logo"><span class="logo-x">X</span><span class="logo-text">game</span></div>
        <div class="avatar" id="avatarBtn"><span id="avatarPlaceholder">👤</span></div>
      </header>

      <nav class="nav">
        <button class="active" data-page="ideas">Идеи</button>
        <button data-page="posts">Посты</button>
        <button data-page="profile">Профиль</button>
        <button data-page="about">О нас</button>
      </nav>

      <div class="page active" id="page-ideas">
        <div class="search">
          <input id="searchInput" placeholder="Поиск проектов...">
          <button id="searchBtn">Найти</button>
        </div>
        <div id="filterBar" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;"></div>
        <div class="grid" id="ideasContainer"></div>
      </div>

      <div class="page" id="page-posts">
        <div class="search">
          <input id="searchPostsInput" placeholder="Поиск постов...">
          <button id="searchPostsBtn">Найти</button>
        </div>
        <div class="grid" id="postsContainer"></div>
      </div>

      <div class="page" id="page-profile">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">👤</div>
          <div class="profile-name" id="profileName">Пользователь</div>
          <div class="profile-user" id="profileUser">@username</div>
        </div>
        <div class="profile-stats">
          <div class="profile-stat"><span class="num" id="statPosts">0</span><span class="label">Постов</span></div>
          <div class="profile-stat"><span class="num" id="statIdeas">0</span><span class="label">Идей</span></div>
          <div class="profile-stat"><span class="num" id="statLikes">0</span><span class="label">Лайков</span></div>
        </div>
        <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
      </div>

      <div class="page" id="page-about">
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:48px;margin-bottom:12px;">🚀</div>
          <h2 style="font-size:24px;margin-bottom:8px;">Xgame</h2>
          <p style="color:var(--muted);font-size:14px;max-width:400px;margin:0 auto;line-height:1.6;">Платформа для идей и проектов</p>
        </div>
      </div>

      <button class="fab" id="fabBtn">+</button>
    </div>
  </div>

  <!-- МОДАЛКИ -->
  <div class="modal" id="postModal">
    <div class="modal-box">
      <h3 id="postModalTitle">Новый пост</h3>
      <input id="postTitle" placeholder="Заголовок (макс 40 символов)" maxlength="40">
      <textarea id="postText" placeholder="Текст поста..."></textarea>
      <input id="postImage" placeholder="Ссылка на картинку (необязательно)">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="postCancel">Отмена</button>
        <button class="modal-btn save" id="postSave">Опубликовать</button>
      </div>
    </div>
  </div>

  <div class="modal" id="ideaModal">
    <div class="modal-box">
      <h3 id="ideaModalTitle">Новая идея</h3>
      <input id="ideaTitle" placeholder="Название (макс 40 символов)" maxlength="40">
      <textarea id="ideaDesc" placeholder="Описание..."></textarea>
      <select id="ideaGenre">
        <option value="">Категория</option>
        <option>Веб-приложение</option>
        <option>Игра</option>
        <option>Инструмент</option>
        <option>Дизайн</option>
        <option>Другое</option>
      </select>
      <textarea id="ideaCode" placeholder="Код проекта (HTML/CSS/JS)..."></textarea>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="ideaCancel">Отмена</button>
        <button class="modal-btn save" id="ideaSave">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="sandbox-overlay" id="sandboxOverlay">
    <div class="sandbox-header">
      <h3 id="sandboxTitle">Проект</h3>
      <button class="sandbox-close" id="sandboxClose">✕</button>
    </div>
    <div class="sandbox-frame">
      <iframe id="sandboxFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <script>
    // ============================================================
    // FIREBASE КОНФИГ (ТВОЙ!)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyC79WgSLxHlno3fqcQcyxw0hvryuQIQKXI",
      authDomain: "xgame-66690.firebaseapp.com",
      projectId: "xgame-66690",
      storageBucket: "xgame-66690.firebasestorage.app",
      messagingSenderId: "628360447691",
      appId: "1:628360447691:web:ac2ee8ecc8c9652cf4fd4e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // XAMCHAT OAuth 2.0 + PKCE
    // ============================================================
    const XAM_CLIENT_ID = 'xam_QshD84Eivo13l1t4vQLFUew';
    const XAM_REDIRECT_URI = 'https://jsksosplals.github.io/Xgame/';

    // Генерация PKCE
    function generatePKCE() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32)))
        .map(b => String.fromCharCode(b))
        .join('');
      const encoder = new TextEncoder();
      return crypto.subtle.digest('SHA-256', encoder.encode(verifier))
        .then(hash => {
          const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
          return { verifier, challenge };
        });
    }

    // Кнопка входа
    document.getElementById('authBtn').addEventListener('click', function() {
      const state = Math.random().toString(36).substring(7);
      sessionStorage.setItem('xgame_oauth_state', state);

      generatePKCE().then(({ verifier, challenge }) => {
        sessionStorage.setItem('xgame_pkce_verifier', verifier);

        const authUrl = 'https://xamchat.ru/oauth/authorize?' + new URLSearchParams({
          client_id: XAM_CLIENT_ID,
          redirect_uri: XAM_REDIRECT_URI,
          response_type: 'code',
          scope: 'profile_basic',
          state: state,
          code_challenge: challenge,
          code_challenge_method: 'S256'
        });

        window.location.href = authUrl;
      });
    });

    // Обмен кода на токен
    async function exchangeCode(code, verifier) {
      const response = await fetch('https://xamchat.ru/oauth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          grant_type: 'authorization_code',
          code: code,
          client_id: XAM_CLIENT_ID,
          redirect_uri: XAM_REDIRECT_URI,
          code_verifier: verifier
        })
      });
      return response.json();
    }

    // Получение данных пользователя
    async function getUserInfo(accessToken) {
      const response = await fetch('https://xamchat.ru/oauth/userinfo', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      return response.json();
    }

    // Обработка возврата из XAMChat
    async function handleAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const savedState = sessionStorage.getItem('xgame_oauth_state');

      if (code && state && state === savedState) {
        sessionStorage.removeItem('xgame_oauth_state');
        const verifier = sessionStorage.getItem('xgame_pkce_verifier');
        sessionStorage.removeItem('xgame_pkce_verifier');

        try {
          const tokenData = await exchangeCode(code, verifier);
          const userData = await getUserInfo(tokenData.access_token);

          const userRef = db.collection('users').doc(userData.username);
          await userRef.set({
            username: userData.username,
            name: userData.name || userData.username,
            avatar_url: userData.avatar_url || '',
            xamchat_id: userData.id || userData.username,
            lastLogin: Date.now()
          }, { merge: true });

          const currentUser = {
            id: userData.username,
            username: userData.username,
            name: userData.name || userData.username,
            avatar_url: userData.avatar_url || '',
            access_token: tokenData.access_token
          };

          localStorage.setItem('xgame_user', JSON.stringify(currentUser));
          window.history.replaceState({}, document.title, window.location.pathname);
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
          document.getElementById('profileName').textContent = currentUser.name || currentUser.username;
          document.getElementById('profileUser').textContent = '@' + currentUser.username;
          if (currentUser.avatar_url) {
            document.getElementById('profileAvatar').innerHTML = `<img src="${currentUser.avatar_url}">`;
            document.getElementById('avatarPlaceholder').innerHTML = `<img src="${currentUser.avatar_url}">`;
          }
          await loadAll();
          console.log('✅ Добро пожаловать, ' + currentUser.name + '!');
          showToast('✅ Добро пожаловать, ' + currentUser.name + '!');
        } catch (error) {
          console.error('Ошибка авторизации:', error);
          document.getElementById('authError').style.display = 'block';
          document.getElementById('authError').textContent = '⚠️ Ошибка авторизации. Попробуйте снова.';
        }
      }
    }

    // ============================================================
    // ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ ИЗ LOCALSTORAGE
    // ============================================================
    function initAuth() {
      const savedUser = localStorage.getItem('xgame_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
          document.getElementById('profileName').textContent = user.name || user.username;
          document.getElementById('profileUser').textContent = '@' + user.username;
          if (user.avatar_url) {
            document.getElementById('profileAvatar').innerHTML = `<img src="${user.avatar_url}">`;
            document.getElementById('avatarPlaceholder').innerHTML = `<img src="${user.avatar_url}">`;
          }
          loadAll();
        } catch {
          localStorage.removeItem('xgame_user');
        }
      }
    }

    function logout() {
      localStorage.removeItem('xgame_user');
      window.location.reload();
    }

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    let posts = [];
    let ideas = [];
    let filter = 'all';
    let search = '';
    let searchPosts = '';
    let currentPage = 'ideas';

    async function loadAll() {
      await Promise.all([loadIdeas(), loadPosts()]);
      updateStats();
    }

    async function loadIdeas() {
      try {
        let query = db.collection('ideas').orderBy('created_at', 'desc');
        if (filter !== 'all') query = query.where('genre', '==', filter);
        if (search) query = query.where('title', '>=', search).where('title', '<=', search + '\uf8ff');

        const snapshot = await query.get();
        ideas = [];
        snapshot.forEach(doc => ideas.push({ id: doc.id, ...doc.data() }));
        renderIdeas();
        renderFilters();
      } catch (e) {
        console.error('Ошибка загрузки идей:', e);
      }
    }

    async function loadPosts() {
      try {
        const snapshot = await db.collection('posts').orderBy('created_at', 'desc').get();
        posts = [];
        snapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
        renderPosts();
      } catch (e) {
        console.error('Ошибка загрузки постов:', e);
      }
    }

    function updateStats() {
      const savedUser = localStorage.getItem('xgame_user');
      if (!savedUser) return;
      const user = JSON.parse(savedUser);
      const userPosts = posts.filter(p => p.author_id === user.id);
      const userIdeas = ideas.filter(i => i.author_id === user.id);
      const totalLikes = userPosts.reduce((sum, p) => sum + (p.likes_count || 0), 0);
      document.getElementById('statPosts').textContent = userPosts.length;
      document.getElementById('statIdeas').textContent = userIdeas.length;
      document.getElementById('statLikes').textContent = totalLikes;
    }

    // ============================================================
    // РЕНДЕР ПОСТОВ
    // ============================================================
    function renderPosts() {
      const container = document.getElementById('postsContainer');
      const filtered = searchPosts
        ? posts.filter(p => p.title?.toLowerCase().includes(searchPosts.toLowerCase()) ||
            p.content?.toLowerCase().includes(searchPosts.toLowerCase()))
        : posts;

      if (!filtered.length) {
        container.innerHTML = `<div class="empty"><div class="icon">📝</div><h4>Нет постов</h4><p>Напишите первый пост!</p></div>`;
        return;
      }

      const savedUser = localStorage.getItem('xgame_user');
      const currentUser = savedUser ? JSON.parse(savedUser) : null;

      container.innerHTML = filtered.map(post => {
        if (!post.reactions) post.reactions = {};
        if (!post.userReactions) post.userReactions = {};
        const userReactions = post.userReactions || {};
        const reactions = post.reactions || {};

        return `
          <div class="post-card" data-post-id="${post.id}">
            <div class="post-header">
              <div class="post-author">
                <img src="${post.author?.avatar_url || ''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22%3E%3Crect fill=%22%23222%22 width=%2232%22 height=%2232%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.35em%22 fill=%22%23666%22 font-size=%2216%22%3E👤%3C/text%3E%3C/svg%3E'">
                <div><div class="name">${post.author?.name || post.author?.username}</div><div class="username">@${post.author?.username}</div></div>
              </div>
              <div class="post-date">${formatDate(post.created_at)}</div>
            </div>
            <h1 class="post-title">${escapeHTML(post.title)}</h1>
            <div class="post-text">${escapeHTML(post.content)}</div>
            ${post.image_url ? `<img src="${post.image_url}" class="post-image" onerror="this.style.display='none'">` : ''}
            <div class="reactions" data-post-id="${post.id}">
              ${['like','fire','clap','wow','laugh'].map(type => {
                const emoji = { like:'❤️', fire:'🔥', clap:'👏', wow:'😮', laugh:'😂' }[type];
                const count = reactions[type] || 0;
                const active = userReactions[type] || false;
                return `<button class="reaction-btn ${active?'active':''}" data-reaction="${type}" data-post-id="${post.id}" onclick="togglePostReaction('${post.id}','${type}')"><span class="emoji">${emoji}</span><span class="count" id="reaction-count-${post.id}-${type}">${count}</span></button>`;
              }).join('')}
              <span class="reaction-limit-text" id="reaction-limit-${post.id}">${Object.values(userReactions).filter(Boolean).length}/3</span>
            </div>
            <div class="post-stats">
              <span class="views">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>${post.views || 0}</span>
              </span>
            </div>
            <button class="comment-button" onclick="toggleComments('${post.id}')">
              <span>💬 Комментарии</span>
              <span class="badge" id="comments-badge-${post.id}">${post.comments_count || 0}</span>
            </button>
            <div class="comments-section" id="comments-section-${post.id}" style="display:none;">
              <div class="comments-title">💬 Комментарии <span style="font-weight:400;color:var(--muted);font-size:13px;" id="comments-count-${post.id}">${post.comments_count || 0}</span></div>
              <div class="comment-form">
                <textarea id="comment-input-${post.id}" placeholder="Написать комментарий..." rows="2"></textarea>
                <div class="form-actions"><div style="font-size:11px;color:var(--muted);">Ctrl+Enter</div><button class="btn-submit" onclick="submitComment('${post.id}')">Отправить</button></div>
              </div>
              <div id="comments-container-${post.id}"><div class="empty-comments">Пока нет комментариев.</div></div>
            </div>
            ${currentUser?.id === post.author_id ? `
              <div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                <button class="edit-btn" onclick="editPost('${post.id}')">✏️ Редактировать</button>
                <button class="delete-btn" onclick="deletePost('${post.id}')">🗑️ Удалить</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // РЕНДЕР ИДЕЙ
    // ============================================================
    function renderIdeas() {
      const container = document.getElementById('ideasContainer');
      if (!ideas.length) {
        container.innerHTML = `<div class="empty"><div class="icon">💡</div><h4>Нет идей</h4><p>Создайте первый проект!</p></div>`;
        return;
      }
      const savedUser = localStorage.getItem('xgame_user');
      const currentUser = savedUser ? JSON.parse(savedUser) : null;

      container.innerHTML = ideas.map(idea => `
        <div class="card">
          <div class="card-header">
            <div class="card-author">
              <img src="${idea.author?.avatar_url || ''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22%3E%3Crect fill=%22%23222%22 width=%2232%22 height=%2232%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.35em%22 fill=%22%23666%22 font-size=%2216%22%3E👤%3C/text%3E%3C/svg%3E'">
              <span class="user">@${idea.author?.username || 'unknown'}</span>
            </div>
            <span style="font-size:10px;color:var(--muted)">${formatDate(idea.created_at)}</span>
          </div>
          <div class="card-title">💡 ${escapeHTML(idea.title)}</div>
          <div class="card-text">${escapeHTML(idea.description)}</div>
          ${idea.code ? `<span class="code-badge">⚡ Код</span>` : ''}
          <div class="tags"><span class="tag">${escapeHTML(idea.genre || 'Без категории')}</span></div>
          <div class="card-actions">
            ${idea.code ? `<button class="run" onclick="runSandbox('${idea.id}')">▶ Запустить</button>` : ''}
            ${currentUser?.id === idea.author_id ? `<button class="del" onclick="deleteIdea('${idea.id}')">🗑️</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderFilters() {
      const container = document.getElementById('filterBar');
      const genres = ['all', ...new Set(ideas.map(i => i.genre).filter(Boolean))];
      container.innerHTML = genres.map(g => `<button class="tag ${g===filter?'active':''}" data-filter="${g}">${g==='all'?'🏷️ Все':g}</button>`).join('');
      container.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => { filter = btn.dataset.filter; loadIdeas(); });
      });
    }

    // ============================================================
    // РЕАКЦИИ
    // ============================================================
    async function togglePostReaction(postId, type) {
      const savedUser = localStorage.getItem('xgame_user');
      if (!savedUser) { showToast('Авторизуйтесь', 'error'); return; }
      const currentUser = JSON.parse(savedUser);
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      if (!post.reactions) post.reactions = {};
      if (!post.userReactions) post.userReactions = {};
      const currentCount = Object.values(post.userReactions).filter(Boolean).length;

      if (post.userReactions[type]) {
        post.reactions[type] = (post.reactions[type] || 1) - 1;
        post.userReactions[type] = false;
        updateReactionUI(postId);
        await db.collection('posts').doc(postId).update({ reactions: post.reactions, userReactions: post.userReactions });
        return;
      }

      if (currentCount >= 3) { showToast('❌ Можно поставить только 3 реакции', 'error'); return; }

      post.reactions[type] = (post.reactions[type] || 0) + 1;
      post.userReactions[type] = true;
      updateReactionUI(postId);
      await db.collection('posts').doc(postId).update({ reactions: post.reactions, userReactions: post.userReactions });
    }

    function updateReactionUI(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      Object.keys(post.reactions).forEach(type => {
        const el = document.getElementById(`reaction-count-${postId}-${type}`);
        if (el) el.textContent = post.reactions[type];
      });
      document.querySelectorAll(`.reaction-btn[data-post-id="${postId}"]`).forEach(btn => {
        const type = btn.dataset.reaction;
        btn.classList.toggle('active', post.userReactions[type] || false);
      });
      const limitEl = document.getElementById(`reaction-limit-${postId}`);
      if (limitEl) {
        const count = Object.values(post.userReactions).filter(Boolean).length;
        limitEl.textContent = `${count}/3`;
      }
    }

    // ============================================================
    // КОММЕНТАРИИ
    // ============================================================
    function toggleComments(postId) {
      const section = document.getElementById(`comments-section-${postId}`);
      if (!section) return;
      const isHidden = section.style.display === 'none' || !section.style.display;
      section.style.display = isHidden ? 'block' : 'none';
      if (isHidden) loadComments(postId);
    }

    async function loadComments(postId) {
      try {
        const snapshot = await db.collection('comments').where('post_id', '==', postId).orderBy('created_at', 'asc').get();
        const comments = [];
        snapshot.forEach(doc => comments.push({ id: doc.id, ...doc.data() }));
        const map = {}, roots = [];
        comments.forEach(c => { map[c.id] = { ...c, replies: [] }; });
        comments.forEach(c => {
          if (c.parent_id && map[c.parent_id]) map[c.parent_id].replies.push(map[c.id]);
          else roots.push(map[c.id]);
        });
        renderCommentsForPost(postId, roots);
      } catch (e) { console.error('Error loading comments:', e); }
    }

    function renderCommentsForPost(postId, comments) {
      const container = document.getElementById(`comments-container-${postId}`);
      if (!container) return;
      if (!comments || !comments.length) {
        container.innerHTML = '<div class="empty-comments">Пока нет комментариев.</div>';
        document.getElementById(`comments-count-${postId}`).textContent = '0';
        document.getElementById(`comments-badge-${postId}`).textContent = '0';
        return;
      }

      function renderTree(items, level = 0) {
        let html = '';
        items.forEach(c => {
          const avatar = c.author?.avatar_url || '';
          html += `
            <div class="comment-item" style="margin-left:${level*20}px;">
              <div class="comment-header">
                <img src="${avatar}" onerror="this.style.display='none'">
                <span class="name">${c.author?.name || c.author?.username}</span>
                <span class="username">@${c.author?.username}</span>
                <span class="date">${formatDate(c.created_at)}</span>
              </div>
              <div class="comment-body">${escapeHTML(c.content)}</div>
              <div class="comment-actions">
                <button class="reply-btn" onclick="replyToComment('${c.id}','${postId}','${c.author?.name}')">↩ Ответить</button>
                ${currentUser?.id === c.author_id ? `<button class="delete" onclick="deleteComment('${c.id}','${postId}')">🗑 Удалить</button>` : ''}
              </div>
              ${c.replies && c.replies.length ? renderTree(c.replies, level+1) : ''}
            </div>
          `;
        });
        return html;
      }

      container.innerHTML = renderTree(comments);
      const count = comments.length;
      document.getElementById(`comments-count-${postId}`).textContent = count;
      document.getElementById(`comments-badge-${postId}`).textContent = count;
    }

    let replyToData = {};
    function replyToComment(commentId, postId, name) {
      replyToData = { commentId, postId, name };
      const input = document.getElementById(`comment-input-${postId}`);
      if (input) { input.placeholder = `Ответ ${name}...`; input.focus(); }
    }

    async function submitComment(postId) {
      const savedUser = localStorage.getItem('xgame_user');
      if (!savedUser) { showToast('Авторизуйтесь', 'error'); return; }
      const currentUser = JSON.parse(savedUser);
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      const parentId = replyToData.postId === postId ? replyToData.commentId : null;
      try {
        await db.collection('comments').add({
          post_id: postId, content, parent_id: parentId || null,
          author_id: currentUser.id, author: currentUser, created_at: Date.now()
        });
        input.value = '';
        input.placeholder = 'Написать комментарий...';
        replyToData = {};
        await loadComments(postId);
        await loadPosts();
        showToast('✅ Комментарий добавлен!');
      } catch (e) { showToast('Ошибка отправки', 'error'); }
    }

    async function deleteComment(commentId, postId) {
      if (!confirm('Удалить комментарий?')) return;
      try {
        await db.collection('comments').doc(commentId).delete();
        await loadComments(postId);
        await loadPosts();
        showToast('🗑 Комментарий удалён');
      } catch (e) { showToast('Ошибка удаления', 'error'); }
    }

    // ============================================================
    // ПЕСОЧНИЦА
    // ============================================================
    function runSandbox(id) {
      const idea = ideas.find(i => i.id === id);
      if (!idea || !idea.code) { showToast('Код не найден', 'error'); return; }
      const overlay = document.getElementById('sandboxOverlay');
      const frame = document.getElementById('sandboxFrame');
      document.getElementById('sandboxTitle').textContent = idea.title || 'Проект';
      overlay.classList.add('active');
      const code = idea.code;
      frame.srcdoc = code.includes('<html') || code.includes('<!DOCTYPE') ? code : `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head><body>${code}</body></html>`;
    }

    document.getElementById('sandboxClose').addEventListener('click', function() {
      document.getElementById('sandboxOverlay').classList.remove('active');
      document.getElementById('sandboxFrame').srcdoc = '';
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('sandboxOverlay').classList.remove('active');
        document.getElementById('sandboxFrame').srcdoc = '';
      }
    });

    // ============================================================
    // CRUD
    // ============================================================
    async function createPost(title, content, image_url) {
      const savedUser = localStorage.getItem('xgame_user');
      if (!savedUser) { showToast('Авторизуйтесь', 'error'); return; }
      const currentUser = JSON.parse(savedUser);
      if (title.length > 40) { showToast('❌ Название не более 40 символов', 'error'); return; }
      try {
        await db.collection('posts').add({
          title, content, image_url, author_id: currentUser.id, author: currentUser,
          reactions: {}, userReactions: {}, views: 0, likes_count: 0, comments_count: 0, created_at: Date.now()
        });
        showToast('✅ Пост опубликован!');
        await loadPosts();
      } catch (e) { showToast('Ошибка публикации', 'error'); }
    }

    async function deletePost(id) {
      if (!confirm('Удалить пост?')) return;
      try { await db.collection('posts').doc(id).delete(); showToast('🗑️ Пост удален'); await loadPosts(); }
      catch (e) { showToast('Ошибка удаления', 'error'); }
    }

    function editPost(id) { showToast('✏️ Редактирование (скоро)', 'info'); }

    async function createIdea(title, description, genre, code) {
      const savedUser = localStorage.getItem('xgame_user');
      if (!savedUser) { showToast('Авторизуйтесь', 'error'); return; }
      const currentUser = JSON.parse(savedUser);
      if (title.length > 40) { showToast('❌ Название не более 40 символов', 'error'); return; }
      try {
        await db.collection('ideas').add({
          title, description, genre, code, author_id: currentUser.id, author: currentUser, created_at: Date.now()
        });
        showToast('✅ Идея создана!');
        await loadIdeas();
      } catch (e) { showToast('Ошибка создания', 'error'); }
    }

    async function deleteIdea(id) {
      if (!confirm('Удалить идею?')) return;
      try { await db.collection('ideas').doc(id).delete(); showToast('🗑️ Идея удалена'); await loadIdeas(); }
      catch (e) { showToast('Ошибка удаления', 'error'); }
    }

    // ============================================================
    // МОДАЛКИ
    // ============================================================
    document.getElementById('fabBtn').addEventListener('click', function() {
      const activePage = document.querySelector('.page.active');
      if (activePage) {
        if (activePage.id === 'page-ideas') document.getElementById('ideaModal').classList.add('active');
        else if (activePage.id === 'page-posts') document.getElementById('postModal').classList.add('active');
      }
    });

    document.getElementById('postCancel').addEventListener('click', function() {
      document.getElementById('postModal').classList.remove('active');
    });

    document.getElementById('postSave').addEventListener('click', async function() {
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postText').value.trim();
      const image_url = document.getElementById('postImage').value.trim();
      if (!title || !content) { showToast('Заполните заголовок и текст', 'error'); return; }
      await createPost(title, content, image_url);
      document.getElementById('postModal').classList.remove('active');
      document.getElementById('postTitle').value = '';
      document.getElementById('postText').value = '';
      document.getElementById('postImage').value = '';
    });

    document.getElementById('ideaCancel').addEventListener('click', function() {
      document.getElementById('ideaModal').classList.remove('active');
    });

    document.getElementById('ideaSave').addEventListener('click', async function() {
      const title = document.getElementById('ideaTitle').value.trim();
      const description = document.getElementById('ideaDesc').value.trim();
      const genre = document.getElementById('ideaGenre').value;
      const code = document.getElementById('ideaCode').value.trim();
      if (!title || !description) { showToast('Заполните название и описание', 'error'); return; }
      await createIdea(title, description, genre, code);
      document.getElementById('ideaModal').classList.remove('active');
      document.getElementById('ideaTitle').value = '';
      document.getElementById('ideaDesc').value = '';
      document.getElementById('ideaCode').value = '';
    });

    // ============================================================
    // ПОИСК
    // ============================================================
    document.getElementById('searchBtn').addEventListener('click', function() {
      search = document.getElementById('searchInput').value;
      loadIdeas();
    });
    document.getElementById('searchInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    document.getElementById('searchPostsBtn').addEventListener('click', function() {
      searchPosts = document.getElementById('searchPostsInput').value;
      renderPosts();
    });
    document.getElementById('searchPostsInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') document.getElementById('searchPostsBtn').click();
    });

    // ============================================================
    // НАВИГАЦИЯ
    // ============================================================
    document.querySelectorAll('.nav button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const page = this.dataset.page;
        document.getElementById(`page-${page}`).classList.add('active');
        currentPage = page;
        const fab = document.getElementById('fabBtn');
        fab.style.display = (page === 'ideas' || page === 'posts') ? 'flex' : 'none';
      });
    });

    document.getElementById('avatarBtn').addEventListener('click', function() {
      document.querySelector('[data-page="profile"]').click();
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    // ============================================================
    // ЗАПУСК
    // ============================================================
    handleAuthCallback();
    initAuth();

    console.log('%c🚀 Xgame v2.0 (Firebase + XAMChat PKCE)', 'font-size:20px;font-weight:bold;color:#6c5ce7;');
    console.log('%c📱 Полная версия сайта с реакциями и комментариями', 'color:#888;');
  </script>
</body>
</html>
