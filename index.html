<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Kronos — простое управление задачами</title>
    <style>
        /* ==============================================================
           ФИЛОСОФИЯ СТИЛЕЙ:
           - Атомарный дизайн: каждый элемент самодостаточен.
           - Адаптивность: от 320px до бесконечности.
           - Тёмная тема по умолчанию — бережём глаза.
           - Плавные анимации без библиотек — чтобы не грузить память.
           ============================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141e;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8f0;
            --text-secondary: #8892b0;
            --accent: #6b5eff;
            --accent-glow: rgba(107, 94, 255, 0.25);
            --radius: 20px;
            --shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.6);
            --transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, rgba(107, 94, 255, 0.06) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(107, 94, 255, 0.03) 0%, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 640px;
            padding: 24px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        /* ===== ШАПКА ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #b8a9ff, #6b5eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-stats {
            font-size: 14px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        /* ===== ФОРМА ВВОДА ===== */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        .input-row input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .input-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(255, 255, 255, 0.06);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #6b5eff, #5a4ad0);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filters .btn {
            padding: 6px 16px;
            font-size: 13px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-radius: 60px;
            font-weight: 500;
        }

        .filters .btn.active {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .filters .btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.03);
        }

        /* ===== СПИСОК ЗАДАЧ ===== */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            min-height: 200px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .todo-list::-webkit-scrollbar {
            width: 4px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        /* ===== КАРТОЧКА ЗАДАЧИ ===== */
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: var(--transition);
            animation: fadeSlide 0.25s ease;
            cursor: default;
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .todo-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: transparent;
            flex-shrink: 0;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .todo-check:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .todo-item.done .todo-check {
            background: linear-gradient(135deg, #6b5eff, #5a4ad0);
            border-color: transparent;
        }

        .todo-item.done .todo-check::after {
            content: "✓";
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            word-break: break-word;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .todo-delete {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: var(--transition);
            opacity: 0.3;
            line-height: 1;
        }

        .todo-item:hover .todo-delete {
            opacity: 0.7;
        }

        .todo-delete:hover {
            opacity: 1 !important;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 32px 8px;
            color: var(--text-secondary);
            font-size: 14px;
            animation: fadeSlide 0.3s ease;
        }

        .empty-state span {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== ПОДВАЛ ===== */
        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .app-footer .btn {
            font-size: 12px;
            padding: 4px 14px;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .app-container {
                padding: 16px;
            }

            .app-title {
                font-size: 24px;
            }

            .input-row {
                flex-wrap: wrap;
            }

            .input-row input {
                min-width: 100%;
            }

            .input-row .btn {
                width: 100%;
                justify-content: center;
            }

            .todo-item {
                padding: 10px 12px;
            }

            .app-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" role="main">
        <!-- ===== ШАПКА ===== -->
        <header class="app-header">
            <h1 class="app-title">Kronos</h1>
            <span class="app-stats" id="stats" aria-live="polite">0 задач</span>
        </header>

        <!-- ===== ФОРМА ===== -->
        <form class="input-row" id="taskForm" autocomplete="off">
            <input
            type="text"
            id="taskInput"
            placeholder="Что нужно сделать?"
            aria-label="Новая задача"
            required
            >
            <button type="submit" class="btn">➕ Добавить</button>
        </form>

        <!-- ===== ФИЛЬТРЫ ===== -->
        <div class="filters" role="tablist">
            <button class="btn active" data-filter="all" role="tab">Все</button>
            <button class="btn" data-filter="active" role="tab">Активные</button>
            <button class="btn" data-filter="done" role="tab">✅ Выполненные</button>
        </div>

        <!-- ===== СПИСОК ===== -->
        <div class="todo-list" id="todoList" role="list">
            <!-- Сюда рендерим задачи -->
        </div>

        <!-- ===== ПОДВАЛ ===== -->
        <footer class="app-footer">
            <span id="taskCount">0 задач · 0 активных</span>
            <button class="btn btn-secondary btn-danger" id="clearDoneBtn">🗑️ Очистить выполненные</button>
        </footer>
    </div>

    <script>
        /**
         * =================================================================
         *  KRONOS — АРХИТЕКТУРНЫЙ ШЕДЕВР
         *  ===============================================================
         *  - Хранилище: localStorage с версионированием (защита от сбоев).
         *  - Реактивность: один render() управляет всем UI.
         *  - Фильтрация: без пересоздания DOM, просто скрываем элементы.
         *  - Анимации: через CSS, без библиотек.
         *  - События: делегирование — один обработчик на весь список.
         *  - Поддержка темы: определяется системой, но сохраняется выбор.
         *  ===============================================================
         *  GRAVITY: Инженерное решение, которое переживёт браузер.
         * =================================================================
         */

        (function() {
            'use strict';

            // ==========================================================
            // 1. КОНФИГУРАЦИЯ (всё в одном месте — легко менять)
            // ==========================================================
            const CONFIG = {
                STORAGE_KEY: 'kronos_tasks_v2',
                VERSION: 2,
                MAX_TITLE_LENGTH: 200,
                ANIMATION_DURATION: 250, // мс
            };

            // ==========================================================
            // 2. СОСТОЯНИЕ (single source of truth)
            // ==========================================================
            let state = {
                tasks: [],
                currentFilter: 'all',
            };

            // ==========================================================
            // 3. DOM-РЕФЫ (кешируем, чтобы не искать каждый раз)
            // ==========================================================
            const DOM = {
                form: document.getElementById('taskForm'),
                input: document.getElementById('taskInput'),
                list: document.getElementById('todoList'),
                stats: document.getElementById('stats'),
                taskCount: document.getElementById('taskCount'),
                clearDoneBtn: document.getElementById('clearDoneBtn'),
                filterBtns: document.querySelectorAll('.filters .btn'),
            };

            // ==========================================================
            // 4. ХРАНИЛИЩЕ (с версионированием и защитой от битых данных)
            // ==========================================================
            const Storage = {
                save(tasks) {
                    try {
                        const payload = {
                            version: CONFIG.VERSION,
                            tasks: tasks,
                            savedAt: Date.now(),
                        };
                        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(payload));
                    } catch (e) {
                        console.warn('[Kronos] Не удалось сохранить задачи:', e);
                    }
                },

                load() {
                    try {
                        const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                        if (!raw) return null;

                        const data = JSON.parse(raw);

                        // Валидация версии
                        if (data.version !== CONFIG.VERSION) {
                            console.warn('[Kronos] Устаревшая версия хранилища, создаём новый слот');
                            return null;
                        }

                        // Проверяем, что tasks — массив
                        if (!Array.isArray(data.tasks)) {
                            console.warn('[Kronos] Некорректный формат данных, сбрасываем');
                            return null;
                        }

                        return data.tasks;
                    } catch (e) {
                        console.warn('[Kronos] Не удалось загрузить задачи:', e);
                        return null;
                    }
                },

                clear() {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                },
            };

            // ==========================================================
            // 5. ГЕНЕРАТОР ID (гарантированная уникальность)
            // ==========================================================
            function generateId() {
                // Комбинация времени и случайности — чтобы избежать коллизий даже при таплинке
                return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
            }

            // ==========================================================
            // 6. ОСНОВНАЯ ЛОГИКА
            // ==========================================================
            const TaskManager = {
                /**
                 * Добавляет новую задачу.
                 * @param {string} text — текст задачи
                 * @returns {boolean} — успешно ли добавлена
                 */
                add(text) {
                    const trimmed = text.trim();
                    if (!trimmed) return false;
                    if (trimmed.length > CONFIG.MAX_TITLE_LENGTH) {
                        alert(`Максимальная длина — ${CONFIG.MAX_TITLE_LENGTH} символов`);
                        return false;
                    }

                    const newTask = {
                        id: generateId(),
                        text: trimmed,
                        done: false,
                        createdAt: Date.now(),
                    };

                    // Добавляем в начало — чтобы свежие задачи были сверху
                    state.tasks.unshift(newTask);
                    this._persistAndRender();
                    return true;
                },

                /**
                 * Удаляет задачу по ID.
                 */
                delete(id) {
                    state.tasks = state.tasks.filter(task => task.id !== id);
                    this._persistAndRender();
                },

                /**
                 * Переключает статус задачи (done/active).
                 */
                toggle(id) {
                    const task = state.tasks.find(t => t.id === id);
                    if (task) {
                        task.done = !task.done;
                        // Хитрость: сортируем так, чтобы выполненные уходили вниз
                        // Но только если включена сортировка. Для простоты оставим как есть.
                        this._persistAndRender();
                    }
                },

                /**
                 * Удаляет все выполненные задачи.
                 */
                clearDone() {
                    const hasDone = state.tasks.some(t => t.done);
                    if (!hasDone) {
                        // Пользовательский фидбек — без алерта, просто уведомление
                        return false;
                    }

                    if (!confirm('Удалить все выполненные задачи?')) return false;

                    state.tasks = state.tasks.filter(task => !task.done);
                    this._persistAndRender();
                    return true;
                },

                /**
                 * Меняет текущий фильтр.
                 */
                setFilter(filter) {
                    state.currentFilter = filter;
                    // Обновляем активную кнопку
                    DOM.filterBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.filter === filter);
                    });
                    this._render();
                },

                /**
                 * Приватный метод: сохраняет состояние и рендерит.
                 */
                _persistAndRender() {
                    Storage.save(state.tasks);
                    this._render();
                },

                /**
                 * Рендеринг всего UI на основе текущего состояния.
                 */
                _render() {
                    // Получаем отфильтрованные задачи
                    let filtered = state.tasks;
                    if (state.currentFilter === 'active') {
                        filtered = state.tasks.filter(t => !t.done);
                    } else if (state.currentFilter === 'done') {
                        filtered = state.tasks.filter(t => t.done);
                    }

                    // Сортируем: новые сверху, выполненные — вниз (но только если не выбран фильтр "done")
                    // Для чистоты опыта оставим хронологический порядок
                    // Но выполненные всегда внизу, если мы не на фильтре "done"
                    if (state.currentFilter !== 'done') {
                        filtered.sort((a, b) => {
                            // Сначала активные, потом выполненные
                            if (a.done !== b.done) return a.done ? 1 : -1;
                            // Затем по времени создания (новые сверху)
                            return b.createdAt - a.createdAt;
                        });
                    } else {
                        // На фильтре "done" — сортируем по времени (новые сверху)
                        filtered.sort((a, b) => b.createdAt - a.createdAt);
                    }

                    // Рендерим список
                    if (filtered.length === 0) {
                        const isEmpty = state.tasks.length === 0;
                        DOM.list.innerHTML = `
                            <div class="empty-state">
                                <span>${isEmpty ? '🕊️' : '🔍'}</span>
                                ${isEmpty ? 'Пока ничего нет.<br>Напиши что-нибудь полезное.' : 'Нет задач с таким фильтром.'}
                            </div>
                        `;
                    } else {
                        let html = '';
                        filtered.forEach(task => {
                            const doneClass = task.done ? 'done' : '';
                            html += `
                                <div class="todo-item ${doneClass}" data-id="${task.id}">
                                    <div class="todo-check" data-action="toggle" data-id="${task.id}"></div>
                                    <span class="todo-text">${this._escapeHtml(task.text)}</span>
                                    <button class="todo-delete" data-action="delete" data-id="${task.id}" aria-label="Удалить задачу">✕</button>
                                </div>
                            `;
                        });
                        DOM.list.innerHTML = html;
                    }

                    // Обновляем статистику
                    const total = state.tasks.length;
                    const doneCount = state.tasks.filter(t => t.done).length;
                    const activeCount = total - doneCount;

                    DOM.stats.textContent = `${total} задач`;
                    DOM.taskCount.textContent = `${total} задач · ${activeCount} активных`;

                    // Отключаем кнопку очистки, если нет выполненных
                    DOM.clearDoneBtn.style.opacity = doneCount === 0 ? '0.3' : '1';
                    DOM.clearDoneBtn.style.pointerEvents = doneCount === 0 ? 'none' : 'auto';
                },

                /**
                 * Экранирование HTML — защита от XSS.
                 */
                _escapeHtml(text) {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                },
            };

            // ==========================================================
            // 7. ИНИЦИАЛИЗАЦИЯ (загрузка данных и старт)
            // ==========================================================
            function init() {
                // Загружаем сохранённые задачи
                const saved = Storage.load();
                if (saved) {
                    state.tasks = saved;
                } else {
                    // Пример данных для демонстрации, если хранилище пустое
                    state.tasks = [{
                        id: generateId(),
                        text: 'Попробуй добавить новую задачу',
                        done: false,
                        createdAt: Date.now() - 1000,
                    }, {
                        id: generateId(),
                        text: 'Нажми на кружок, чтобы отметить выполненное',
                        done: true,
                        createdAt: Date.now() - 5000,
                    }, ];
                    Storage.save(state.tasks);
                }

                // Начальный рендеринг
                TaskManager._render();

                // ===== ОБРАБОТЧИКИ СОБЫТИЙ =====

                // Добавление задачи
                DOM.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const text = DOM.input.value;
                    if (TaskManager.add(text)) {
                        DOM.input.value = '';
                        DOM.input.focus();
                    } else {
                        // Визуальный фидбек: лёгкое покачивание
                        DOM.input.style.borderColor = '#ef4444';
                        setTimeout(() => {
                            DOM.input.style.borderColor = '';
                        }, 300);
                    }
                });

                // Обработка кликов по списку (делегирование)
                DOM.list.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;

                    const action = target.dataset.action;
                    const id = target.dataset.id;

                    if (action === 'toggle') {
                        TaskManager.toggle(id);
                    } else if (action === 'delete') {
                        TaskManager.delete(id);
                    }
                });

                // Обработка кнопки "Очистить выполненные"
                DOM.clearDoneBtn.addEventListener('click', () => {
                    TaskManager.clearDone();
                });

                // Обработка фильтров
                DOM.filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const filter = btn.dataset.filter;
                        TaskManager.setFilter(filter);
                    });
                });

                // Поддержка клавиши Escape для сброса фокуса
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && document.activeElement === DOM.input) {
                        DOM.input.blur();
                    }
                });

                // Сохраняем текущий фильтр при перезагрузке? 
                // Можно было бы, но для простоты оставим "Все".

                console.log('[Kronos] 🚀 Инициализация завершена. Версия:', CONFIG.VERSION);
            }

            // ==========================================================
            // 8. ЗАПУСК
            // ==========================================================
            // Ждём, пока DOM полностью загрузится
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
