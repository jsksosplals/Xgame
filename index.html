<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Xgame</title>
    <style>
        /* ================================================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a12;
            --bg-secondary: #12121e;
            --text: #e8e8f0;
            --text-secondary: #8892b0;
            --accent: #7c3aed;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 20px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s;
        }

        body.light {
            --bg: #f0f0f5;
            --bg-secondary: #e8e8f0;
            --text: #1a1a2e;
            --text-secondary: #4b5563;
            --border: rgba(0, 0, 0, 0.06);
        }

        .glass {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        /* ================================================================
           НАВБАР
           ================================================================ */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 10, 18, 0.85);
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            box-shadow: none;
        }

        body.light #navbar {
            background: rgba(240, 240, 245, 0.85);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 10px 24px;
            border-radius: 60px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .nav-links a.active {
            color: var(--text);
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.3);
        }

        .nav-links a:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
        }

        .search-wrapper input {
            padding: 8px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 180px;
        }

        .search-wrapper input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .filter-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .filter-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* ================================================================
           ДРОПДАУН ФИЛЬТРА
           ================================================================ */
        .filter-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            min-width: 180px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        body.light .filter-dropdown {
            background: rgba(240, 240, 245, 0.95);
        }

        .filter-dropdown button {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-dropdown button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .filter-dropdown button.active {
            background: rgba(124, 58, 237, 0.15);
            color: var(--text);
        }

        /* ================================================================
           СТРАНИЦЫ
           ================================================================ */
        #content {
            padding: 24px 20px 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-block {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .page-block.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================================================================
           КАРТОЧКИ ИДЕЙ И ПОСТОВ
           ================================================================ */
        .ideas-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width:640px) {
            .ideas-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(min-width:1024px) {
            .ideas-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .idea-card {
            padding: 24px;
        }

        .idea-card .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .idea-card .meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .idea-card .desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .reactions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .reaction-btn {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
        }

        .reaction-btn.active {
            background: rgba(124, 58, 237, 0.15);
            border-color: #7c3aed;
            color: var(--text);
        }

        .post-card {
            padding: 24px;
            margin-bottom: 20px;
        }

        .post-card .content {
            white-space: pre-wrap;
            color: var(--text-secondary);
            margin: 12px 0;
            font-size: 15px;
            line-height: 1.6;
        }

        .post-card img {
            max-width: 100%;
            border-radius: 16px;
            margin-top: 12px;
        }

        /* ================================================================
           ПЕСОЧНИЦА
           ================================================================ */
        .sandbox {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .sandbox textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
        }

        .sandbox iframe {
            width: 100%;
            min-height: 200px;
            border-radius: 12px;
            background: #fff;
            margin-top: 8px;
        }

        /* ================================================================
           МОДАЛКИ
           ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: rgba(20, 20, 30, 0.96);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        body.light .modal {
            background: rgba(240, 240, 245, 0.96);
        }

        .modal h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .modal input:focus,
        .modal textarea:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal .btn-row {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ================================================================
           ПРОФИЛЬ
           ================================================================ */
        .back-btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .back-btn-circle:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .avatar-xl {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: #fff;
            margin: 0 auto 12px;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .name-text {
            font-size: 22px;
            font-weight: 700;
        }

        .tag-text {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .info-card-prof {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            text-align: left;
            margin-bottom: 16px;
        }

        .info-row-prof {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row-prof:last-child {
            border-bottom: none;
        }

        .info-label-prof {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .info-val-prof {
            color: var(--text-primary);
            font-weight: 500;
        }

        .segmented-prof {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 60px;
            margin-bottom: 16px;
        }

        .segmented-prof button {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .segmented-prof button.active {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #fff;
            font-weight: 600;
        }

        /* ================================================================
           FAB
           ================================================================ */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none;
            color: #fff;
            font-size: 34px;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.05);
        }

        /* ================================================================
           ЗАГРУЗЧИК
           ================================================================ */
        .loader {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        /* ================================================================
           АДАПТИВ
           ================================================================ */
        @media(max-width:480px) {
            #navbar {
                padding: 10px 16px;
                gap: 8px;
            }

            .logo {
                font-size: 20px;
            }

            .nav-links a {
                padding: 6px 14px;
                font-size: 13px;
            }

            .search-wrapper input {
                width: 120px;
            }

            .fab {
                width: 48px;
                height: 48px;
                font-size: 26px;
                bottom: 16px;
                right: 16px;
            }

            .avatar-xl {
                width: 72px;
                height: 72px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
       КОНТЕЙНЕР ДЛЯ ПРИЛОЖЕНИЯ
       ================================================================ -->
    <div id="app"></div>

    <!-- ================================================================
       СКРИПТЫ
       ================================================================ -->
    <script type="module">
        import { initApp } from './src/app/app.js';

        // Запускаем приложение
        initApp().catch((error) => {
            console.error('[Global] Ошибка запуска:', error);
            document.getElementById('app').innerHTML = `
                <div style="padding:40px;text-align:center;max-width:600px;margin:40px auto;background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.2);border-radius:20px;">
                    <h2 style="color:#ef4444;">🚫 Не удалось запустить приложение</h2>
                    <p style="color:var(--text-secondary);margin-top:8px;">${error.message || 'Неизвестная ошибка'}</p>
                    <button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;border:none;border-radius:60px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:600;cursor:pointer;">🔄 Перезагрузить</button>
                </div>
            `;
        });
    </script>
</body>
</html>
