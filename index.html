<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Xgame — финальная версия</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a12;--bg-secondary:#12121e;--text:#e8e8f0;--text-secondary:#8892b0;--accent:#7c3aed;--border:rgba(255,255,255,0.06);--radius:20px;--shadow:0 20px 60px rgba(0,0,0,0.5)}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:all .3s}
        body.light{--bg:#f0f0f5;--bg-secondary:#e8e8f0;--text:#1a1a2e;--text-secondary:#4b5563;--border:rgba(0,0,0,0.06)}
        .glass{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:all .3s}
        .glass:hover{background:rgba(255,255,255,0.07)}
        .btn{padding:10px 24px;border:none;border-radius:60px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:all .3s}
        .btn:hover{transform:scale(1.02);box-shadow:0 8px 25px rgba(124,58,237,0.25)}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:rgba(255,255,255,0.05)}
        .btn-sm{padding:6px 16px;font-size:13px}
        #navbar{position:sticky;top:0;z-index:1000;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;backdrop-filter:blur(20px);background:rgba(10,10,18,0.85);border-bottom:1px solid var(--border)}
        body.light #navbar{background:rgba(240,240,245,0.85)}
        .logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap}
        .nav-links a{padding:10px 24px;border-radius:60px;color:var(--text-secondary);font-weight:600;font-size:15px;cursor:pointer;transition:all .3s;text-decoration:none;border:1px solid transparent}
        .nav-links a.active{color:var(--text);background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.3)}
        .nav-links a:hover:not(.active){background:rgba(255,255,255,0.05)}
        .nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
        .search-wrapper input{padding:8px 16px;border-radius:60px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;outline:none;transition:all .3s;width:180px}
        .search-wrapper input:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,0.15)}
        .filter-circle{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;color:#fff;font-size:18px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .filter-circle:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(124,58,237,0.3)}
        .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;cursor:pointer;overflow:hidden;flex-shrink:0;color:#fff;border:2px solid rgba(255,255,255,0.1)}
        .filter-dropdown{position:absolute;top:60px;right:0;background:rgba(10,10,18,0.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-width:180px;z-index:100;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
        body.light .filter-dropdown{background:rgba(240,240,245,0.95)}
        .filter-dropdown button{padding:8px 16px;border:none;border-radius:10px;background:transparent;color:var(--text-secondary);font-size:14px;text-align:left;cursor:pointer;transition:all .3s;font-weight:500}
        .filter-dropdown button:hover{background:rgba(255,255,255,0.05);color:var(--text)}
        .filter-dropdown button.active{background:rgba(124,58,237,0.15);color:var(--text)}
        #content{padding:24px 20px 100px;max-width:1200px;margin:0 auto}
        .page{display:none;animation:fadeSlide .3s ease}
        .page.active{display:block}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .ideas-grid{display:grid;grid-template-columns:1fr;gap:20px}
        @media(min-width:640px){.ideas-grid{grid-template-columns:1fr 1fr}}
        @media(min-width:1024px){.ideas-grid{grid-template-columns:1fr 1fr 1fr}}
        .idea-card{padding:24px}
        .idea-card .title{font-size:18px;font-weight:700;margin-bottom:6px}
        .idea-card .meta{font-size:13px;color:var(--text-secondary);display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
        .idea-card .desc{color:var(--text-secondary);font-size:14px;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .reactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
        .reaction-btn{padding:6px 16px;border-radius:40px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .3s;font-size:14px;font-weight:600}
        .reaction-btn.active{background:rgba(124,58,237,0.15);border-color:#7c3aed;color:var(--text)}
        .post-card{padding:24px;margin-bottom:20px}
        .post-card .content{white-space:pre-wrap;color:var(--text-secondary);margin:12px 0;font-size:15px;line-height:1.6}
        .post-card img{max-width:100%;border-radius:16px;margin-top:12px}
        .sandbox{margin-top:12px;border:1px solid var(--border);border-radius:16px;padding:16px;background:rgba(0,0,0,0.2)}
        .sandbox textarea{width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);font-family:'Courier New',monospace;font-size:13px;resize:vertical;min-height:60px}
        .sandbox iframe{width:100%;min-height:200px;border-radius:12px;background:#fff;margin-top:8px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.open{display:flex}
        .modal{background:rgba(20,20,30,0.96);backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
        body.light .modal{background:rgba(240,240,245,0.96)}
        .modal h2{font-size:24px;margin-bottom:20px}
        .modal input,.modal textarea{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:15px;outline:none;transition:all .3s}
        .modal input:focus,.modal textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,0.15)}
        .modal .form-group{margin-bottom:16px}
        .modal .form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
        .modal .btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
        .profile-dropdown{position:absolute;top:60px;right:0;width:280px;padding:16px;z-index:1000;background:rgba(10,10,18,0.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);animation:fadeSlide .25s ease}
        body.light .profile-dropdown{background:rgba(240,240,245,0.95)}
        .fab{position:fixed;bottom:28px;right:28px;z-index:999;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;color:#fff;font-size:34px;box-shadow:0 12px 40px rgba(124,58,237,0.4);cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
        .fab:hover{transform:scale(1.05)}
        .loader{text-align:center;padding:20px;color:var(--text-secondary);cursor:pointer}
        .loader:hover{color:#7c3aed}
        .hidden{display:none!important}
        @media(max-width:480px){#navbar{padding:10px 16px;gap:8px}.logo{font-size:20px}.nav-links a{padding:6px 14px;font-size:13px}.search-wrapper input{width:120px}.fab{width:48px;height:48px;font-size:26px;bottom:16px;right:16px}}
        /* ДЛЯ ПРОФИЛЯ */
        .back-btn-circle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;margin-bottom:8px}
        .back-btn-circle:hover{background:rgba(255,255,255,0.08)}
        .avatar-xl{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;margin:0 auto 12px;box-shadow:0 12px 40px rgba(124,58,237,0.25);border:2px solid rgba(255,255,255,0.08)}
        .name-text{font-size:22px;font-weight:700}
        .tag-text{color:var(--text-secondary);font-size:14px;margin-bottom:16px}
        .info-card-prof{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:left;margin-bottom:16px}
        .info-row-prof{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
        .info-row-prof:last-child{border-bottom:none}
        .info-label-prof{color:var(--text-secondary);font-size:14px}
        .info-val-prof{color:var(--text-primary);font-weight:500}
        .segmented-prof{display:flex;gap:6px;background:rgba(255,255,255,0.04);padding:4px;border-radius:60px;margin-bottom:16px}
        .segmented-prof button{flex:1;padding:8px 0;border:none;border-radius:60px;background:transparent;color:var(--text-secondary);font-weight:500;cursor:pointer;transition:all .3s}
        .segmented-prof button.active{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:600}
    </style>
</head>
<body>

    <!-- НАВБАР -->
    <nav id="navbar">
        <div class="logo">Xgame</div>
        <div class="nav-links">
            <a data-page="ideas" class="active">Идеи</a>
            <a data-page="posts">Посты</a>
            <a data-page="about">О нас</a>
        </div>
        <div class="nav-right">
            <div class="search-wrapper"><input type="text" id="searchInput" placeholder="Поиск"></div>
            <button class="filter-circle" id="filterToggleBtn">⚙️</button>
            <button id="themeToggle" class="btn btn-outline btn-sm">🌓</button>
            <div id="authBlock">
                <button class="btn btn-sm btn-outline" id="loginBtn">Войти</button>
                <button class="btn btn-sm" id="registerBtn">Регистрация</button>
            </div>
            <div id="profileBlock" class="hidden" style="position:relative;">
                <div class="avatar" id="avatarBtn"><span id="avatarText">U</span></div>
            </div>
        </div>
    </nav>

    <!-- ДРОПДАУН ФИЛЬТРА -->
    <div id="filterDropdown" class="filter-dropdown hidden">
        <button data-sort="newest" class="active">🆕 Новые</button>
        <button data-sort="popular">🔥 Популярные</button>
        <button data-sort="views">👁️ По просмотрам</button>
    </div>

    <!-- КОНТЕНТ -->
    <div id="content">
        <div id="page-ideas" class="page active">
            <div id="ideasContainer" class="ideas-grid"></div>
            <div id="ideasLoader" class="loader">Загрузка...</div>
        </div>
        <div id="page-posts" class="page">
            <h2 style="font-size:26px;margin-bottom:20px;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">📰 Посты</h2>
            <div id="postsContainer"></div>
            <div id="postsLoader" class="loader">Загрузка...</div>
        </div>
        <div id="page-about" class="page">
            <div class="glass" style="padding:32px;">
                <h2 style="font-size:26px;margin-bottom:16px;">О проекте</h2>
                <p style="color:var(--text-secondary);line-height:1.7;font-size:15px;"><strong>Xgame</strong> — платформа для обмена идеями и новостями в сфере кода.</p>
            </div>
        </div>
        <!-- СТРАНИЦА ПРОФИЛЯ -->
        <div id="page-profile" class="page">
            <div class="page-block" style="text-align:center; max-width:480px; margin:0 auto; padding:24px 0;">
                <div class="back-btn-circle" id="btn-back-from-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
                <div class="avatar-xl">👤</div>
                <div class="name-text" id="profileName">Пользователь</div>
                <div class="tag-text" id="profileTag">@user</div>
                <div class="info-card-prof">
                    <div class="info-row-prof"><div class="info-label-prof">Username</div><div class="info-val-prof" id="profileUsername">@user</div></div>
                    <div class="info-row-prof"><div class="info-label-prof">Никнейм</div><div class="info-val-prof" id="profileNickname">Пользователь</div></div>
                    <div class="info-row-prof"><div class="info-label-prof">Описание</div><div class="info-val-prof" style="color:#888;" id="profileBio">—</div></div>
                </div>
                <div class="segmented-prof">
                    <button class="active" id="seg-ideas">Идеи <span style="font-weight:400;">(0)</span></button>
                    <button id="seg-posts">Посты <span style="font-weight:400;">(0)</span></button>
                </div>
                <div id="profile-feed-container" style="text-align:left; min-height:200px;">
                    <div class="glass" style="padding:32px; text-align:center; color:var(--text-secondary);"><span style="font-size:24px;display:block;margin-bottom:8px;">💡</span>Здесь будут идеи пользователя.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button id="fabBtn" class="fab">+</button>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <h2 id="authModalTitle">Вход</h2>
            <div class="form-group"><label>Email</label><input id="authEmail" type="email" placeholder="example@mail.com"></div>
            <div class="form-group"><label>Пароль</label><input id="authPassword" type="password" placeholder="••••••••"></div>
            <div id="authNicknameGroup" class="form-group hidden"><label>Никнейм</label><input id="authNickname" placeholder="Ваш никнейм"></div>
            <div id="authError" style="color:#ef4444;font-size:14px;margin-bottom:12px;display:none;"></div>
            <div class="btn-row"><button class="btn btn-outline" id="authCancelBtn">Отмена</button><button class="btn" id="authSubmitBtn">Войти</button></div>
            <div style="margin-top:12px;text-align:center;font-size:14px;color:var(--text-secondary);">
                <span id="authToggleText">Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a></span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. КОНФИГУРАЦИЯ
        // ================================================================
        const SUPABASE_URL = 'https://mpganamwcjxvnmqzqdi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZ2FuYW13Y2p4dm5tcXpxZHFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NzgzMzYsImV4cCI6MjEwMTU1NDMzNn0.MWsBCuaJ8ON8Nf5D8F-U_AA8oRraf4DdIGriNHucj4A';

        // ================================================================
        // 2. СОСТОЯНИЕ
        // ================================================================
        let state = {
            user: null,
            profile: null,
            ideas: [],
            posts: [],
            currentPage: 'ideas',
            theme: 'dark',
            sort: 'newest',
            search: '',
            ideaOffset: 0,
            postOffset: 0,
            hasMoreIdeas: true,
            hasMorePosts: true
        };

        const DOM = {
            content: document.getElementById('content'),
            ideasContainer: document.getElementById('ideasContainer'),
            ideasLoader: document.getElementById('ideasLoader'),
            postsContainer: document.getElementById('postsContainer'),
            postsLoader: document.getElementById('postsLoader'),
            searchInput: document.getElementById('searchInput'),
            themeToggle: document.getElementById('themeToggle'),
            authBlock: document.getElementById('authBlock'),
            profileBlock: document.getElementById('profileBlock'),
            avatarBtn: document.getElementById('avatarBtn'),
            avatarText: document.getElementById('avatarText'),
            loginBtn: document.getElementById('loginBtn'),
            registerBtn: document.getElementById('registerBtn'),
            fabBtn: document.getElementById('fabBtn'),
            authModal: document.getElementById('authModal'),
            authModalTitle: document.getElementById('authModalTitle'),
            authEmail: document.getElementById('authEmail'),
            authPassword: document.getElementById('authPassword'),
            authNickname: document.getElementById('authNickname'),
            authNicknameGroup: document.getElementById('authNicknameGroup'),
            authError: document.getElementById('authError'),
            authSubmitBtn: document.getElementById('authSubmitBtn'),
            authCancelBtn: document.getElementById('authCancelBtn'),
            authToggleLink: document.getElementById('authToggleLink'),
            authToggleText: document.getElementById('authToggleText'),
            navLinks: document.querySelectorAll('.nav-links a'),
            filterToggleBtn: document.getElementById('filterToggleBtn'),
            filterDropdown: document.getElementById('filterDropdown'),
            // Профиль
            profileName: document.getElementById('profileName'),
            profileTag: document.getElementById('profileTag'),
            profileUsername: document.getElementById('profileUsername'),
            profileNickname: document.getElementById('profileNickname'),
            profileBio: document.getElementById('profileBio'),
            segIdeas: document.getElementById('seg-ideas'),
            segPosts: document.getElementById('seg-posts'),
            profileFeed: document.getElementById('profile-feed-container'),
            btnBackProfile: document.getElementById('btn-back-from-profile'),
            pageProfile: document.getElementById('page-profile'),
        };

        // ================================================================
        // 3. УТИЛИТЫ
        // ================================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showModal(modal) {
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function hideModal(modal) {
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        // ================================================================
        // 4. ЗАГРУЗКА ДАННЫХ
        // ================================================================
        async function loadIdeas(reset = false) {
            if (reset) { state.ideas = [];
                state.ideaOffset = 0;
                state.hasMoreIdeas = true }
            if (!state.hasMoreIdeas) return;
            DOM.ideasLoader.textContent = 'Загрузка...';
            try {
                const supabase = window.supabaseClient;
                if (!supabase) throw new Error('Supabase не загружен');
                let query = supabase.from('ideas')
                    .select('*, profiles:user_id (username,nickname,avatar_url)')
                    .order(state.sort === 'newest' ? 'created_at' : 'views', { ascending: false })
                    .range(state.ideaOffset, state.ideaOffset + 9);
                if (state.search) query = query.ilike('title', `%${state.search}%`);
                const { data, error } = await query;
                if (error) throw error;
                if (data.length < 10) state.hasMoreIdeas = false;
                state.ideas = reset ? data : [...state.ideas, ...data];
                state.ideaOffset += data.length;
                renderIdeas();
                DOM.ideasLoader.textContent = state.hasMoreIdeas ? 'Загрузить ещё' : '🎉 Все идеи загружены';
            } catch (error) {
                console.error('Ошибка загрузки идей:', error);
                DOM.ideasLoader.textContent = '❌ ' + error.message;
            }
        }

        async function loadPosts(reset = false) {
            if (reset) { state.posts = [];
                state.postOffset = 0;
                state.hasMorePosts = true }
            if (!state.hasMorePosts) return;
            DOM.postsLoader.textContent = 'Загрузка...';
            try {
                const supabase = window.supabaseClient;
                if (!supabase) throw new Error('Supabase не загружен');
                const { data, error } = await supabase.from('posts')
                    .select('*, profiles:author_id (username,nickname,avatar_url)')
                    .order('created_at', { ascending: false })
                    .range(state.postOffset, state.postOffset + 9);
                if (error) throw error;
                if (data.length < 10) state.hasMorePosts = false;
                state.posts = reset ? data : [...state.posts, ...data];
                state.postOffset += data.length;
                renderPosts();
                DOM.postsLoader.textContent = state.hasMorePosts ? 'Загрузить ещё' : '🎉 Все посты загружены';
            } catch (error) {
                console.error('Ошибка загрузки постов:', error);
                DOM.postsLoader.textContent = '❌ ' + error.message;
            }
        }

        // ================================================================
        // 5. РЕНДЕРИНГ
        // ================================================================
        function renderIdeas() {
            if (state.ideas.length === 0) {
                DOM.ideasContainer.innerHTML =
                    `<div class="glass" style="padding:40px;text-align:center;grid-column:1/-1;"><p style="font-size:40px;margin-bottom:8px;">💡</p><p style="color:var(--text-secondary);">Нет идей. Будь первым!</p></div>`;
                return;
            }
            DOM.ideasContainer.innerHTML = state.ideas.map(idea => {
                const reactions = idea.reactions || [];
                const reactionCounts = {};
                reactions.forEach(r => { reactionCounts[r.reaction_type] = (reactionCounts[r.reaction_type] || 0) +
                    1 });
                return `
                    <div class="glass idea-card" data-id="${idea.id}">
                        <div class="title">${escapeHtml(idea.title)}</div>
                        <div class="meta">
                            <span>by ${idea.profiles?.nickname || 'Аноним'}</span>
                            <span>${new Date(idea.created_at).toLocaleDateString()}</span>
                            <span style="margin-left:auto;">👁️ ${idea.views || 0}</span>
                        </div>
                        ${idea.description ? `<div class="desc">${escapeHtml(idea.description)}</div>` : ''}
                        <button class="btn btn-outline btn-sm" data-toggle-sandbox="${idea.id}">▶ Песочница</button>
                        <div class="sandbox hidden" id="sandbox-${idea.id}">
                            <div style="display:grid;gap:8px;">
                                <textarea data-sandbox-html="${idea.id}" rows="2">${escapeHtml(idea.code_html || '')}</textarea>
                                <textarea data-sandbox-css="${idea.id}" rows="2">${escapeHtml(idea.code_css || '')}</textarea>
                                <textarea data-sandbox-js="${idea.id}" rows="2">${escapeHtml(idea.code_js || '')}</textarea>
                                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                    <button class="btn btn-sm" data-run-sandbox="${idea.id}">▶ Запустить</button>
                                    <button class="btn btn-outline btn-sm" data-save-sandbox="${idea.id}">💾 Сохранить</button>
                                    <button class="btn btn-outline btn-sm" data-history-sandbox="${idea.id}">📜 История</button>
                                </div>
                                <iframe id="sandbox-frame-${idea.id}"></iframe>
                            </div>
                        </div>
                        <div class="reactions">
                            ${['👍','👎','❤','🚀','💡'].map(type => `
                                <button class="reaction-btn" data-reaction="${type}" data-target="idea" data-id="${idea.id}">${type} ${reactionCounts[type] || 0}</button>
                            `).join('')}
                            <button class="reaction-btn" data-report="idea" data-id="${idea.id}">🚩</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPosts() {
            if (state.posts.length === 0) {
                DOM.postsContainer.innerHTML =
                    `<div class="glass" style="padding:40px;text-align:center;"><p style="font-size:40px;margin-bottom:8px;">📭</p><p style="color:var(--text-secondary);">Пока нет постов</p></div>`;
                return;
            }
            DOM.postsContainer.innerHTML = state.posts.map(post => `
                <div class="glass post-card">
                    <h2 style="font-size:22px;font-weight:700;">${escapeHtml(post.title)}</h2>
                    <div style="display:flex;gap:12px;font-size:13px;color:var(--text-secondary);margin:4px 0 12px;">
                        <span>by ${post.profiles?.nickname || 'Admin'}</span>
                        <span>${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="content">${escapeHtml(post.content)}</div>
                    ${post.image_url ? `<img src="${post.image_url}" alt="${escapeHtml(post.title)}" style="max-width:100%;border-radius:16px;margin-top:12px;">` : ''}
                </div>
            `).join('');
        }

        // ================================================================
        // 6. АВТОРИЗАЦИЯ
        // ================================================================
        async function initAuth() {
            try {
                const supabase = window.supabaseClient;
                if (!supabase) return;
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    state.user = user;
                    DOM.authBlock.classList.add('hidden');
                    DOM.profileBlock.classList.remove('hidden');
                    DOM.avatarText.textContent = user.user_metadata?.nickname?.charAt(0) || 'U';
                    const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                    state.profile = profile;
                    updateProfileUI();
                }
            } catch (error) { console.error('Ошибка загрузки сессии:', error) }
        }

        function updateProfileUI() {
            if (state.profile) {
                DOM.profileName.textContent = state.profile.nickname || 'Пользователь';
                DOM.profileTag.textContent = '@' + (state.profile.username || 'user');
                DOM.profileUsername.textContent = '@' + (state.profile.username || 'user');
                DOM.profileNickname.textContent = state.profile.nickname || 'Пользователь';
                DOM.profileBio.textContent = state.profile.bio || '—';
            }
        }

        // ================================================================
        // 7. НАВИГАЦИЯ
        // ================================================================
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            DOM.navLinks.forEach(link => { link.classList.toggle('active', link.dataset.page === page) });
            state.currentPage = page;
        }

        function navigateToProfile() {
            navigateTo('profile');
            updateProfileUI();
            // Загружаем идеи пользователя в профиль
            const userIdeas = state.ideas.filter(i => i.user_id === state.user?.id);
            const userPosts = state.posts.filter(p => p.author_id === state.user?.id);
            DOM.segIdeas.innerHTML = `Идеи <span style="font-weight:400;">(${userIdeas.length})</span>`;
            DOM.segPosts.innerHTML = `Посты <span style="font-weight:400;">(${userPosts.length})</span>`;
            DOM.profileFeed.innerHTML = userIdeas.length > 0 ?
                userIdeas.map(i =>
                    `<div class="glass idea-card" style="padding:12px;margin-bottom:8px;">${escapeHtml(i.title)}</div>`
                    ).join('') :
                `<div class="glass" style="padding:32px;text-align:center;color:var(--text-secondary);"><span style="font-size:24px;display:block;margin-bottom:8px;">💡</span>Нет идей</div>`;
        }

        // ================================================================
        // 8. ПЕСОЧНИЦА (ИСТОРИЯ)
        // ================================================================
        function getSandboxHistory(ideaId) {
            try { return JSON.parse(localStorage.getItem('sandbox-history') || '{}')[ideaId] || [] } catch { return [] }
        }

        function saveSandboxVersion(ideaId, html, css, js) {
            try {
                const all = JSON.parse(localStorage.getItem('sandbox-history') || '{}');
                if (!all[ideaId]) all[ideaId] = [];
                all[ideaId].unshift({ timestamp: Date.now(), html, css, js });
                if (all[ideaId].length > 10) all[ideaId] = all[ideaId].slice(0, 10);
                localStorage.setItem('sandbox-history', JSON.stringify(all));
                alert('✅ Версия сохранена в историю!');
            } catch (error) { console.error(error) }
        }

        function showSandboxHistory(ideaId) {
            const history = getSandboxHistory(ideaId);
            if (history.length === 0) { alert('История пуста'); return }
            let message = '📜 История изменений:\n\n';
            history.forEach((v, i) => {
                message += `Версия #${i+1} (${new Date(v.timestamp).toLocaleString()})\n`;
                message += `HTML: ${v.html.slice(0,30)}...\nCSS: ${v.css.slice(0,30)}...\nJS: ${v.js.slice(0,30)}...\n\n`;
            });
            message += 'Введите номер версии (0 отмена):';
            const version = prompt(message);
            if (version && !isNaN(version) && version > 0 && version <= history.length) {
                const v = history[version - 1];
                document.querySelector(`[data-sandbox-html="${ideaId}"]`).value = v.html;
                document.querySelector(`[data-sandbox-css="${ideaId}"]`).value = v.css;
                document.querySelector(`[data-sandbox-js="${ideaId}"]`).value = v.js;
                document.querySelector(`[data-run-sandbox="${ideaId}"]`)?.click();
                alert('✅ Версия восстановлена!');
            }
        }

        // ================================================================
        // 9. ТЕМА
        // ================================================================
        function toggleTheme() {
            document.body.classList.toggle('light');
            const theme = document.body.classList.contains('light') ? 'light' : 'dark';
            localStorage.setItem('xgame-theme', theme);
        }

        function applyTheme() {
            const saved = localStorage.getItem('xgame-theme') || 'dark';
            if (saved === 'light') document.body.classList.add('light');
        }

        // ================================================================
        // 10. ИНИЦИАЛИЗАЦИЯ
        // ================================================================
        async function initApp() {
            if (!window.supabaseClient) {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                script.onload = () => {
                    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    startApp();
                };
                script.onerror = () => alert('❌ Не удалось загрузить Supabase');
                document.head.appendChild(script);
            } else { startApp() }
        }

        async function startApp() {
            applyTheme();
            await initAuth();
            await loadIdeas(true);
            await loadPosts(true);

            // ===== НАВИГАЦИЯ =====
            DOM.navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const page = link.dataset.page;
                    if (page === 'profile') { navigateToProfile(); return; }
                    navigateTo(page);
                    if (page === 'ideas') loadIdeas(true);
                    if (page === 'posts') loadPosts(true);
                });
            });

            // ===== ПОИСК =====
            DOM.searchInput.addEventListener('input', () => {
                state.search = DOM.searchInput.value.trim();
                loadIdeas(true);
            });

            // ===== ТЕМА =====
            DOM.themeToggle.addEventListener('click', toggleTheme);

            // ===== ФИЛЬТР =====
            DOM.filterToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                DOM.filterDropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#filterToggleBtn') && !e.target.closest('#filterDropdown')) {
                    DOM.filterDropdown.classList.add('hidden');
                }
            });
            DOM.filterDropdown.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    DOM.filterDropdown.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.sort = btn.dataset.sort;
                    loadIdeas(true);
                    DOM.filterDropdown.classList.add('hidden');
                });
            });

            // ===== АВТОРИЗАЦИЯ =====
            DOM.loginBtn.addEventListener('click', () => {
                DOM.authModalTitle.textContent = 'Вход';
                DOM.authSubmitBtn.textContent = 'Войти';
                DOM.authNicknameGroup.classList.add('hidden');
                DOM.authToggleText.innerHTML =
                'Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a>';
                showModal(DOM.authModal);
            });

            DOM.registerBtn.addEventListener('click', () => {
                DOM.authModalTitle.textContent = 'Регистрация';
                DOM.authSubmitBtn.textContent = 'Зарегистрироваться';
                DOM.authNicknameGroup.classList.remove('hidden');
                DOM.authToggleText.innerHTML =
                'Уже есть аккаунт? <a href="#" id="authToggleLink" style="color:#7c3aed;">Войти</a>';
                showModal(DOM.authModal);
            });

            DOM.authCancelBtn.addEventListener('click', () => {
                hideModal(DOM.authModal);
                DOM.authError.style.display = 'none';
            });

            DOM.authModal.addEventListener('click', (e) => {
                if (e.target === DOM.authModal) {
                    hideModal(DOM.authModal);
                    DOM.authError.style.display = 'none';
                }
            });

            DOM.authToggleLink.addEventListener('click', (e) => {
                e.preventDefault();
                const isLogin = DOM.authModalTitle.textContent === 'Вход';
                if (isLogin) {
                    DOM.authModalTitle.textContent = 'Регистрация';
                    DOM.authSubmitBtn.textContent = 'Зарегистрироваться';
                    DOM.authNicknameGroup.classList.remove('hidden');
                    DOM.authToggleText.innerHTML =
                        'Уже есть аккаунт? <a href="#" id="authToggleLink" style="color:#7c3aed;">Войти</a>';
                } else {
                    DOM.authModalTitle.textContent = 'Вход';
                    DOM.authSubmitBtn.textContent = 'Войти';
                    DOM.authNicknameGroup.classList.add('hidden');
                    DOM.authToggleText.innerHTML =
                        'Нет аккаунта? <a href="#" id="authToggleLink" style="color:#7c3aed;">Зарегистрироваться</a>';
                }
                DOM.authError.style.display = 'none';
                DOM.authEmail.value = '';
                DOM.authPassword.value = '';
                DOM.authNickname.value = '';
            });

            DOM.authSubmitBtn.addEventListener('click', async () => {
                const email = DOM.authEmail.value.trim();
                const password = DOM.authPassword.value.trim();
                const nickname = DOM.authNickname.value.trim();
                if (!email || !password) {
                    DOM.authError.textContent = 'Заполните все поля';
                    DOM.authError.style.display = 'block';
                    return;
                }
                if (DOM.authModalTitle.textContent === 'Регистрация' && !nickname) {
                    DOM.authError.textContent = 'Введите никнейм';
                    DOM.authError.style.display = 'block';
                    return;
                }
                try {
                    const supabase = window.supabaseClient;
                    let result;
                    if (DOM.authModalTitle.textContent === 'Вход') {
                        result = await supabase.auth.signInWithPassword({ email, password });
                    } else {
                        result = await supabase.auth.signUp({
                            email,
                            password,
                            options: { data: { nickname } }
                        });
                    }
                    if (result.error) throw new Error(result.error.message);
                    state.user = result.data.user;
                    DOM.authBlock.classList.add('hidden');
                    DOM.profileBlock.classList.remove('hidden');
                    DOM.avatarText.textContent = result.data.user.user_metadata?.nickname?.charAt(0) || 'U';
                    hideModal(DOM.authModal);
                    DOM.authError.style.display = 'none';
                    const { data: profile } = await supabase.from('profiles').select('*').eq('id', result.data.user.id)
                        .single();
                    state.profile = profile;
                    updateProfileUI();
                    alert(`✅ ${DOM.authModalTitle.textContent === 'Вход' ? 'Вход' : 'Регистрация'} выполнен!`);
                } catch (error) {
                    DOM.authError.textContent = error.message || 'Ошибка авторизации';
                    DOM.authError.style.display = 'block';
                }
            });

            // ===== ПРОФИЛЬ =====
            DOM.avatarBtn.addEventListener('click', navigateToProfile);
            DOM.btnBackProfile.addEventListener('click', () => navigateTo('ideas'));

            // Вкладки в профиле
            DOM.segIdeas.addEventListener('click', () => {
                DOM.segIdeas.classList.add('active');
                DOM.segPosts.classList.remove('active');
                const userIdeas = state.ideas.filter(i => i.user_id === state.user?.id);
                DOM.profileFeed.innerHTML = userIdeas.length > 0 ?
                    userIdeas.map(i =>
                        `<div class="glass idea-card" style="padding:12px;margin-bottom:8px;">${escapeHtml(i.title)}</div>`
                        ).join('') :
                    `<div class="glass" style="padding:32px;text-align:center;color:var(--text-secondary);"><span style="font-size:24px;display:block;margin-bottom:8px;">💡</span>Нет идей</div>`;
            });

            DOM.segPosts.addEventListener('click', () => {
                DOM.segPosts.classList.add('active');
                DOM.segIdeas.classList.remove('active');
                const userPosts = state.posts.filter(p => p.author_id === state.user?.id);
                DOM.profileFeed.innerHTML = userPosts.length > 0 ?
                    userPosts.map(p =>
                        `<div class="glass post-card" style="padding:12px;margin-bottom:8px;">${escapeHtml(p.title)}</div>`
                        ).join('') :
                    `<div class="glass" style="padding:32px;text-align:center;color:var(--text-secondary);"><span style="font-size:24px;display:block;margin-bottom:8px;">📰</span>Нет постов</div>`;
            });

            // ===== FAB =====
            DOM.fabBtn.addEventListener('click', () => {
                if (!state.user) { alert('Войдите, чтобы добавить идею'); return }
                const title = prompt('Название идеи (до 40 символов):');
                if (!title) return;
                const desc = prompt('Описание (необязательно):');
                const html = prompt('HTML код (необязательно):') || '';
                const css = prompt('CSS код (необязательно):') || '';
                const js = prompt('JavaScript код (необязательно):') || '';
                window.supabaseClient.from('ideas').insert({
                    title,
                    description: desc,
                    code_html: html,
                    code_css: css,
                    code_js: js,
                    user_id: state.user.id
                }).then(({ error }) => {
                    if (error) { alert('Ошибка: ' + error.message); return }
                    alert('✅ Идея опубликована!');
                    loadIdeas(true);
                });
            });

            // ===== ПЕСОЧНИЦА =====
            document.addEventListener('click', (e) => {
                const toggle = e.target.closest('[data-toggle-sandbox]');
                if (toggle) { document.getElementById(`sandbox-${toggle.dataset.toggleSandbox}`).classList.toggle(
                    'hidden') }
                const run = e.target.closest('[data-run-sandbox]');
                if (run) {
                    const id = run.dataset.runSandbox;
                    const html = document.querySelector(`[data-sandbox-html="${id}"]`).value;
                    const css = document.querySelector(`[data-sandbox-css="${id}"]`).value;
                    const js = document.querySelector(`[data-sandbox-js="${id}"]`).value;
                    const frame = document.getElementById(`sandbox-frame-${id}`);
                    const doc = frame.contentDocument || frame.contentWindow?.document;
                    if (doc) { doc.open();
                        doc.write(
                            `<html><head><style>${css}</style></head><body>${html}</body><script>${js}<\/script></html>`
                            );
                        doc.close() }
                }
                const save = e.target.closest('[data-save-sandbox]');
                if (save) {
                    const id = save.dataset.saveSandbox;
                    const html = document.querySelector(`[data-sandbox-html="${id}"]`).value;
                    const css = document.querySelector(`[data-sandbox-css="${id}"]`).value;
                    const js = document.querySelector(`[data-sandbox-js="${id}"]`).value;
                    saveSandboxVersion(id, html, css, js);
                }
                const history = e.target.closest('[data-history-sandbox]');
                if (history) { showSandboxHistory(history.dataset.historySandbox) }
                const reaction = e.target.closest('[data-reaction]');
                if (reaction) {
                    const type = reaction.dataset.reaction;
                    const id = reaction.dataset.id;
                    // Заглушка для реакций
                    alert(`Реакция "${type}" на идею ${id} (заглушка)`);
                }
                const report = e.target.closest('[data-report]');
                if (report) {
                    const reason = prompt('Причина жалобы:');
                    if (reason) alert('🚩 Жалоба отправлена');
                }
            });

            DOM.ideasLoader.addEventListener('click', () => loadIdeas(false));
            DOM.postsLoader.addEventListener('click', () => loadPosts(false));

            // Если пользователь залогинен, показываем аватар
            if (state.user) {
                DOM.authBlock.classList.add('hidden');
                DOM.profileBlock.classList.remove('hidden');
                DOM.avatarText.textContent = state.user.user_metadata?.nickname?.charAt(0) || 'U';
            }

            console.log('✅ Xgame инициализирован!');
        }

        // ================================================================
        // 11. ЗАПУСК
        // ================================================================
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
