<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent IDE + Supabase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #2d2d2d;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        .header h1 {
            font-size: 18px;
            flex: 1;
            min-width: 140px;
        }
        .header button {
            background: #0d47a1;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .header button.secondary {
            background: #424242;
        }
        .header button.secondary:hover {
            background: #555;
        }
        .header button.agent-on {
            background: #1b5e20;
            border: 1px solid #4caf50;
        }
        .header button.agent-off {
            background: #b71c1c;
            border: 1px solid #f44336;
        }
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
            min-width: 0;
        }
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .editor-tabs {
            display: flex;
            background: #252525;
            border-bottom: 1px solid #444;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #2d2d2d;
            border: none;
            color: #888;
            font-size: 13px;
        }
        .tab.active {
            background: #1e1e1e;
            color: #0d47a1;
            border-bottom: 2px solid #0d47a1;
        }
        .editor-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        .CodeMirror {
            height: 100% !important;
            font-size: 13px !important;
        }
        .preview-label {
            background: #2d2d2d;
            padding: 6px 14px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
        }
        #preview {
            flex: 1;
            border: none;
            background: #fff;
        }
        .chat-section {
            background: #252525;
            border-top: 1px solid #444;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 170px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 4px;
            font-size: 13px;
        }
        .message {
            margin-bottom: 8px;
            padding: 6px 12px;
            border-radius: 4px;
            line-height: 1.4;
        }
        .message.user {
            background: #0d47a1;
            color: #fff;
            text-align: right;
            margin-left: 20px;
        }
        .message.ai {
            background: #333;
            color: #e0e0e0;
            margin-right: 20px;
        }
        .message.system {
            background: #444;
            color: #aaa;
            text-align: center;
            font-size: 12px;
        }
        .chat-input-group {
            display: flex;
            gap: 8px;
        }
        .chat-input-group input {
            flex: 1;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
        }
        .chat-input-group input:focus {
            outline: none;
            border-color: #0d47a1;
        }
        .chat-input-group button {
            background: #0d47a1;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .chat-input-group button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            align-items: center;
            margin-left: 8px;
        }
        .loading.active {
            display: flex;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-top: 2px solid #0d47a1;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .preview-section {
                display: none;
            }
            .chat-section {
                height: 120px;
            }
            .header h1 {
                font-size: 16px;
            }
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .modal-buttons .confirm {
            background: #0d47a1;
            color: #fff;
        }
        .modal-buttons .cancel {
            background: #444;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 AI Agent IDE</h1>
            <button onclick="autoPreview()">▶ Обновить</button>
            <button id="agentToggle" class="agent-on" onclick="toggleAgent()">🤖 AI-агент: Вкл</button>
            <button class="secondary" onclick="openSaveModal()">💾 Сохранить</button>
            <button class="secondary" onclick="exportProject()">📥 Экспорт</button>
            <button class="secondary" onclick="openLoadModal()">📤 Загрузить</button>
        </div>
        <div class="main">
            <div class="editor-section">
                <div class="editor-tabs">
                    <button class="tab active" onclick="switchTab('html')">HTML</button>
                    <button class="tab" onclick="switchTab('css')">CSS</button>
                    <button class="tab" onclick="switchTab('js')">JavaScript</button>
                </div>
                <div class="editor-container">
                    <textarea id="htmlEditor"></textarea>
                    <textarea id="cssEditor" style="display:none;"></textarea>
                    <textarea id="jsEditor" style="display:none;"></textarea>
                </div>
            </div>
            <div class="preview-section">
                <div class="preview-label"><span>Preview</span><button class="secondary" onclick="autoPreview()" style="background:#0d47a1;color:#fff;border:none;padding:2px 12px;border-radius:4px;">Обновить</button></div>
                <iframe id="preview"></iframe>
            </div>
        </div>
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="Скажи что-то ИИ..." onkeypress="if(event.key==='Enter') sendMessage()" />
                <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                <div class="loading" id="chatLoading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <!-- Модалки -->
    <div class="modal" id="saveModal">
        <div class="modal-content">
            <h2>Сохранить проект</h2>
            <input type="text" id="projectName" placeholder="Название" value="Мой проект" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #444;color:#e0e0e0;border-radius:4px;margin-bottom:10px;" />
            <textarea id="projectDesc" placeholder="Описание" rows="2" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #444;color:#e0e0e0;border-radius:4px;margin-bottom:10px;"></textarea>
            <div class="modal-buttons">
                <button class="confirm" onclick="saveProject()">Сохранить</button>
                <button class="cancel" onclick="closeModal('saveModal')">Отмена</button>
            </div>
        </div>
    </div>
    <div class="modal" id="loadModal">
        <div class="modal-content">
            <h2>Загрузить проект (JSON)</h2>
            <textarea id="jsonInput" rows="6" style="width:100%;padding:10px;background:#1e1e1e;border:1px solid #444;color:#e0e0e0;border-radius:4px;margin-bottom:10px;"></textarea>
            <div class="modal-buttons">
                <button class="confirm" onclick="loadProject()">Загрузить</button>
                <button class="cancel" onclick="closeModal('loadModal')">Отмена</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js">
    </script>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // ИМПОРТ SUPABASE
        // ============================================================
        import { createClient } from '@supabase/supabase-js';

        // ============================================================
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        const editors = {
            html: CodeMirror.fromTextArea(document.getElementById('htmlEditor'), { mode: 'htmlmixed', theme: 'dracula',
                lineNumbers: true, autoCloseTags: true, matchBrackets: true, indentUnit: 2 }),
            css: CodeMirror.fromTextArea(document.getElementById('cssEditor'), { mode: 'css', theme: 'dracula',
                lineNumbers: true, matchBrackets: true, indentUnit: 2 }),
            js: CodeMirror.fromTextArea(document.getElementById('jsEditor'), { mode: 'javascript', theme: 'dracula',
                lineNumbers: true, matchBrackets: true, indentUnit: 2 })
        };

        let currentTab = 'html';
        let apiKey = localStorage.getItem('apiKey') || '';
        let agentEnabled = localStorage.getItem('agentEnabled') !== 'false';
        let supabaseClient = null;

        // ============================================================
        // ПОМОЩНИКИ
        // ============================================================
        function getCode() {
            return { html: editors.html.getValue(), css: editors.css.getValue(), js: editors.js.getValue() };
        }

        function setCode(code) {
            if (code.html !== undefined) editors.html.setValue(code.html);
            if (code.css !== undefined) editors.css.setValue(code.css);
            if (code.js !== undefined) editors.js.setValue(code.js);
            autoPreview();
            autoSave();
        }

        function autoPreview() {
            const c = getCode();
            const full =
                `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>${c.css}</style></head><body>${c.html}<script>${c.js}<\/script></body></html>`;
            document.getElementById('preview').srcdoc = full;
        }

        function autoSave() {
            localStorage.setItem('ideaCode', JSON.stringify(getCode()));
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('ideaCode');
            if (stored) {
                const data = JSON.parse(stored);
                if (data.html) editors.html.setValue(data.html);
                if (data.css) editors.css.setValue(data.css);
                if (data.js) editors.js.setValue(data.js);
            } else {
                editors.html.setValue('<h1>Привет, AI Agent!</h1><p>Попроси меня что-то изменить</p>');
            }
            autoPreview();
        }

        function switchTab(tab) {
            Object.keys(editors).forEach(k => { editors[k].getWrapperElement().style.display = 'none'; });
            editors[tab].getWrapperElement().style.display = 'block';
            editors[tab].refresh();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            currentTab = tab;
        }
        window.switchTab = switchTab;

        // ============================================================
        // КНОПКА AI-АГЕНТА
        // ============================================================
        function toggleAgent() {
            agentEnabled = !agentEnabled;
            localStorage.setItem('agentEnabled', agentEnabled);
            const btn = document.getElementById('agentToggle');
            if (agentEnabled) {
                btn.textContent = '🤖 AI-агент: Вкл';
                btn.className = 'agent-on';
                addSystemMessage('✅ AI-агент включён.');
            } else {
                btn.textContent = '🤖 AI-агент: Выкл';
                btn.className = 'agent-off';
                addSystemMessage('⛔ AI-агент выключен.');
            }
        }
        window.toggleAgent = toggleAgent;

        // ============================================================
        // ЧАТ
        // ============================================================
        function addMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        window.addMessage = addMessage;

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        window.addSystemMessage = addSystemMessage;

        // ============================================================
        // SUPABASE
        // ============================================================
        async function initSupabase() {
            let url = localStorage.getItem('supabase_url');
            let key = localStorage.getItem('supabase_anon_key');

            if (!url || !key) {
                url = prompt('Введите Supabase URL:');
                key = prompt('Введите Supabase anon key:');
                if (url && key) {
                    localStorage.setItem('supabase_url', url);
                    localStorage.setItem('supabase_anon_key', key);
                } else {
                    addSystemMessage('⚠️ Supabase не подключена.');
                    return;
                }
            }

            try {
                supabaseClient = createClient(url, key);
                addSystemMessage('✅ Supabase подключена!');

                // Проверка
                const { error } = await supabaseClient.from('messages').select('count', { count: 'exact' });
                if (error) {
                    addSystemMessage('⚠️ Ошибка доступа к таблице messages: ' + error.message);
                } else {
                    addSystemMessage('📊 Таблица messages доступна.');
                    await loadMessagesFromSupabase();
                }
            } catch (e) {
                addSystemMessage('❌ Ошибка Supabase: ' + e.message);
            }
        }

        async function saveMessageToSupabase(role, content) {
            if (!supabaseClient) return;
            try {
                const { error } = await supabaseClient.from('messages').insert([
                    { role, content, created_at: new Date().toISOString() }
                ]);
                if (error) console.error('Ошибка сохранения:', error);
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }

        async function loadMessagesFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(50);
                if (error) {
                    console.error('Ошибка загрузки:', error);
                    return;
                }
                if (data) {
                    data.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
                    });
                }
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }

        // ============================================================
        // ОТПРАВКА СООБЩЕНИЯ (DeepSeek + Supabase)
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            if (!apiKey) {
                addSystemMessage('⚠️ Установи API ключ: setApiKey("sk-...")');
                return;
            }

            addMessage(text, 'user');
            await saveMessageToSupabase('user', text);
            input.value = '';

            const btn = document.getElementById('sendBtn');
            const loading = document.getElementById('chatLoading');
            btn.disabled = true;
            loading.classList.add('active');

            try {
                const code = getCode();
                const systemContent = agentEnabled ?
                    `Ты — AI-агент в IDE. Меняй код, если просят. Отвечай JSON с ключами html, css, js. Если не просят код — отвечай текстом.
                Сейчас код: HTML: ${code.html} CSS: ${code.css} JS: ${code.js}
                Запрос: ${text}` :
                    `Ты — AI-помощник. Отвечай только текстом. НЕ меняй код. Запрос: ${text}`;

                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'system', content: systemContent }],
                        temperature: 0.5,
                        max_tokens: 2000
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;

                    if (agentEnabled) {
                        try {
                            const match = reply.match(/\{[\s\S]*\}/);
                            if (match) {
                                const parsed = JSON.parse(match[0]);
                                if (parsed.html !== undefined || parsed.css !== undefined || parsed.js !== undefined) {
                                    setCode({
                                        html: parsed.html || code.html,
                                        css: parsed.css || code.css,
                                        js: parsed.js || code.js
                                    });
                                    addSystemMessage('✅ Код обновлён.');
                                    await saveMessageToSupabase('ai', '✅ Код обновлён.');
                                    return;
                                }
                            }
                        } catch (e) { /* не JSON */ }
                    }

                    addMessage(reply, 'ai');
                    await saveMessageToSupabase('ai', reply);
                } else {
                    addSystemMessage('❌ Ошибка: ' + (data.error?.message || 'неизвестно'));
                }
            } catch (e) {
                addSystemMessage('❌ Ошибка: ' + e.message);
            }

            btn.disabled = false;
            loading.classList.remove('active');
        }
        window.sendMessage = sendMessage;

        // ============================================================
        // УСТАНОВКА API КЛЮЧА
        // ============================================================
        window.setApiKey = function(key) {
            apiKey = key;
            localStorage.setItem('apiKey', key);
            addSystemMessage('✅ API ключ сохранён!');
        };

        // ============================================================
        // СОХРАНЕНИЕ / ЭКСПОРТ / ЗАГРУЗКА
        // ============================================================
        function openSaveModal() {
            const saved = localStorage.getItem('ideaSaved');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('projectName').value = data.name || 'Мой проект';
                document.getElementById('projectDesc').value = data.description || '';
            }
            document.getElementById('saveModal').classList.add('active');
        }
        window.openSaveModal = openSaveModal;

        function saveProject() {
            const name = document.getElementById('projectName').value || 'project';
            const desc = document.getElementById('projectDesc').value || '';
            const project = { name, description: desc, code: getCode(), savedAt: new Date().toISOString() };
            localStorage.setItem('ideaSaved', JSON.stringify(project));
            addSystemMessage('✅ Проект сохранён!');
            closeModal('saveModal');
        }
        window.saveProject = saveProject;

        function exportProject() {
            const name = document.getElementById('projectName').value || 'project';
            const desc = document.getElementById('projectDesc').value || '';
            const json = JSON.stringify({ name, description: desc, code: getCode() }, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name + '.json';
            a.click();
        }
        window.exportProject = exportProject;

        function openLoadModal() {
            document.getElementById('loadModal').classList.add('active');
        }
        window.openLoadModal = openLoadModal;

        function loadProject() {
            try {
                const json = JSON.parse(document.getElementById('jsonInput').value);
                if (json.code) {
                    setCode(json.code);
                    addSystemMessage('✅ Проект загружен!');
                    closeModal('loadModal');
                } else {
                    alert('Неверный формат: нужен ключ "code"');
                }
            } catch (e) {
                alert('Ошибка JSON: ' + e.message);
            }
        }
        window.loadProject = loadProject;

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        window.closeModal = closeModal;

        // ============================================================
        // СТАРТ
        // ============================================================
        loadFromStorage();

        const btn = document.getElementById('agentToggle');
        if (agentEnabled) {
            btn.textContent = '🤖 AI-агент: Вкл';
            btn.className = 'agent-on';
        } else {
            btn.textContent = '🤖 AI-агент: Выкл';
            btn.className = 'agent-off';
        }

        addSystemMessage('🧠 AI Agent IDE загружена.');
        if (!apiKey) addSystemMessage('⚠️ Введи в консоли: setApiKey("sk-...")');

        // Подключаем Supabase
        await initSupabase();
    </script>
</body>
</html>
