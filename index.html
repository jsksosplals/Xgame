<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Xgame</title>
    <style>
        /* ================================================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a12;
            --bg-secondary: #12121e;
            --text: #e8e8f0;
            --text-secondary: #8892b0;
            --accent: #7c3aed;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 20px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s;
        }

        body.light {
            --bg: #f0f0f5;
            --bg-secondary: #e8e8f0;
            --text: #1a1a2e;
            --text-secondary: #4b5563;
            --border: rgba(0, 0, 0, 0.06);
        }

        .glass {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .hidden {
            display: none !important;
        }

        /* ================================================================
           ЗАГРУЗЧИК
           ================================================================ */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-container .error-icon {
            font-size: 48px;
        }

        .loader-container .error-text {
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }

        /* ================================================================
           НАВБАР И ОСТАЛЬНЫЕ СТИЛИ (СОКРАЩЕНЫ ДЛЯ ЭКОНОМИИ МЕСТА)
           ================================================================ */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 18, 0.85);
            border-bottom: 1px solid var(--border);
        }

        body.light #navbar {
            background: rgba(240, 240, 245, 0.85);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 10px 24px;
            border-radius: 60px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .nav-links a.active {
            color: var(--text);
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.3);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
        }

        .search-wrapper input {
            padding: 8px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 180px;
        }

        .filter-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            overflow: hidden;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .filter-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            min-width: 180px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .filter-dropdown button {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-dropdown button.active {
            background: rgba(124, 58, 237, 0.15);
            color: var(--text);
        }

        #content {
            padding: 24px 20px 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Остальные стили — как в твоей версии, сократил для экономии места */
        .ideas-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width:640px) {
            .ideas-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media(min-width:1024px) {
            .ideas-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
        .idea-card {
            padding: 24px;
        }
        .idea-card .title {
            font-size: 18px;
            font-weight: 700;
        }
        .reactions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .reaction-btn {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .post-card {
            padding: 24px;
            margin-bottom: 20px;
        }
        .sandbox {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
        }
        .sandbox textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
        }
        .sandbox iframe {
            width: 100%;
            min-height: 200px;
            border-radius: 12px;
            background: #fff;
            margin-top: 8px;
        }
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none;
            color: #fff;
            font-size: 34px;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
        .hidden {
            display: none !important;
        }
        @media(max-width:480px) {
            #navbar {
                padding: 10px 16px;
                gap: 8px;
            }
            .logo {
                font-size: 20px;
            }
            .nav-links a {
                padding: 6px 14px;
                font-size: 13px;
            }
            .search-wrapper input {
                width: 120px;
            }
            .fab {
                width: 48px;
                height: 48px;
                font-size: 26px;
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================
       КОНТЕЙНЕР ПРИЛОЖЕНИЯ (С ЗАГРУЗЧИКОМ ПО УМОЛЧАНИЮ)
       ================================================================ -->
    <div id="app">
        <div class="loader-container" id="initialLoader">
            <div class="spinner"></div>
            <div style="color:var(--text-secondary);">Загрузка Xgame...</div>
        </div>
    </div>

    <script>
        /**
         * ================================================================
         *  СКРИПТ ЗАГРУЗКИ С FALLBACK-ОМ
         *  ===============================================================
         *  1. Пытаемся загрузить Supabase
         *  2. Если не загрузился за 5 секунд — показываем ошибку
         *  3. Если загрузился — запускаем приложение
         * ================================================================
         */

        // ================================================================
        // 1. КОНФИГУРАЦИЯ
        // ================================================================
        const SUPABASE_URL = 'https://mpganamwcjxvnmqzqdi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZ2FuYW13Y2p4dm5tcXpxZHFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NzgzMzYsImV4cCI6MjEwMTU1NDMzNn0.MWsBCuaJ8ON8Nf5D8F-U_AA8oRraf4DdIGriNHucj4A';

        // ================================================================
        // 2. ПРОВЕРКА ИНТЕРНЕТА
        // ================================================================
        function checkInternet() {
            return navigator.onLine;
        }

        // ================================================================
        // 3. ЗАГРУЗКА SUPABASE С ТАЙМАУТОМ
        // ================================================================
        function loadSupabaseWithTimeout(timeout = 5000) {
            return new Promise((resolve, reject) => {
                // Если уже загружен
                if (window.supabase) {
                    resolve(window.supabase);
                    return;
                }

                // Таймаут
                const timer = setTimeout(() => {
                    reject(new Error('Превышено время ожидания загрузки Supabase'));
                }, timeout);

                // Загружаем скрипт
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                script.onload = () => {
                    clearTimeout(timer);
                    if (window.supabase) {
                        resolve(window.supabase);
                    } else {
                        reject(new Error('Supabase не загрузился'));
                    }
                };
                script.onerror = () => {
                    clearTimeout(timer);
                    reject(new Error('Ошибка загрузки Supabase (CDN недоступен)'));
                };
                document.head.appendChild(script);
            });
        }

        // ================================================================
        // 4. ПОКАЗ ОШИБКИ
        // ================================================================
        function showError(message, details = '') {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="loader-container">
                    <div class="error-icon">📡</div>
                    <h2 style="color:#ef4444;">${message}</h2>
                    <p class="error-text">${details || 'Проверьте подключение к интернету и попробуйте снова.'}</p>
                    <button class="btn" onclick="location.reload()">🔄 Обновить страницу</button>
                    <button class="btn btn-outline" onclick="location.href='https://xamchat.ru/'">🌐 Проверить интернет</button>
                </div>
            `;
        }

        // ================================================================
        // 5. ЗАПУСК ПРИЛОЖЕНИЯ
        // ================================================================
        async function startApp() {
            try {
                // Проверяем интернет
                if (!checkInternet()) {
                    showError('Нет подключения к интернету', 'Проверьте Wi-Fi или мобильные данные');
                    return;
                }

                // Загружаем Supabase
                const supabaseLib = await loadSupabaseWithTimeout(8000);
                window.supabaseClient = supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Загружаем основное приложение (app.js)
                const { initApp } = await import('./src/app/app.js');
                await initApp();

                // Убираем загрузчик
                const loader = document.getElementById('initialLoader');
                if (loader) loader.remove();

            } catch (error) {
                console.error('[Loader] Ошибка:', error);
                showError(
                    'Не удалось загрузить приложение',
                    error.message || 'Попробуйте обновить страницу или проверьте интернет'
                );
            }
        }

        // ================================================================
        // 6. ЗАПУСК
        // ================================================================
        // Даём браузеру время на отрисовку
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
