<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Xgame — платформа для идей и проектов с встроенной песочницей кода">
    <title>Xgame</title>

    <!-- ============================================================
    СТИЛИ
    ============================================================ -->
    <style>
        /* ===== СБРОС ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --danger: #ff6b6b;
            --success: #51cf66;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== СКРОЛЛБАР ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ===== УТИЛИТЫ ===== */
        .hidden {
            display: none !important;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        #auth-screen.hidden {
            display: none;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }

        .auth-card .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
        }

        .auth-card .logo-x {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-card .logo-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-card h3 {
            font-size: 20px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .auth-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: 0 4px 16px var(--accent-glow);
            cursor: pointer;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.4);
            background: linear-gradient(135deg, var(--accent-hover), #8d7ff5);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-x {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 14px;
            color: var(--text-secondary);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .avatar:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .nav {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .nav button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
        }

        .nav button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* ===== СТРАНИЦЫ ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ПОИСК ===== */
        .search {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 6px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .search input::placeholder {
            color: var(--text-muted);
        }

        .search button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
        }

        .search button:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        /* ===== ГРИД ===== */
        .grid {
            display: grid;
            gap: 12px;
        }

        /* ===== КАРТОЧКА ПОСТА ===== */
        .post-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            margin-bottom: 20px;
        }

        .post-card:hover {
            border-color: rgba(108, 92, 231, 0.2);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-author img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .post-author .name {
            font-weight: 600;
            font-size: 14px;
        }

        .post-author .username {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .post-author .username:hover {
            color: var(--accent);
        }

        .post-date {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .post-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .post-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-image {
            width: 100%;
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            max-height: 400px;
            object-fit: cover;
        }

        /* ===== РЕАКЦИИ ===== */
        .reactions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 14px;
        }

        .reaction-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px 12px 4px 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .reaction-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .reaction-btn:active {
            transform: scale(0.95);
        }

        .reaction-btn .emoji {
            font-size: 16px;
            line-height: 1;
        }

        .reaction-btn .count {
            font-size: 11px;
            font-weight: 600;
            min-width: 6px;
        }

        .reaction-btn.active {
            background: rgba(108, 92, 231, 0.15);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        .reaction-btn.shake {
            animation: shake 0.3s ease;
            border-color: var(--danger) !important;
        }

        .reaction-limit-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        /* ===== СТАТИСТИКА ===== */
        .post-stats {
            display: flex;
            gap: 16px;
            align-items: center;
            padding-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .post-stats .views {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-stats .views svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== КНОПКА КОММЕНТАРИЕВ ===== */
        .comment-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            margin-top: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .comment-button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .comment-button:active {
            transform: scale(0.98);
        }

        .comment-button .badge {
            background: var(--accent);
            color: #fff;
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        /* ===== КОММЕНТАРИИ ===== */
        .comments-section {
            margin-top: 16px;
            display: none;
        }

        .comments-section.open {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .comments-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .comment-form {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .comment-form textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 44px;
            outline: none;
            padding: 4px 0;
            user-select: text;
            -webkit-user-select: text;
        }

        .comment-form textarea::placeholder {
            color: var(--text-muted);
        }

        .comment-form .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .btn-submit {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-item .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .comment-item .comment-header img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .comment-item .comment-header .name {
            font-size: 13px;
            font-weight: 600;
        }

        .comment-item .comment-header .username {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-item .comment-header .date {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
            white-space: nowrap;
        }

        .comment-item .comment-body {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            padding-left: 36px;
            word-wrap: break-word;
            user-select: text;
            -webkit-user-select: text;
        }

        .comment-item .comment-actions {
            display: flex;
            gap: 12px;
            padding-left: 36px;
            margin-top: 4px;
        }

        .comment-item .comment-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .comment-item .comment-actions button:hover {
            color: var(--text-primary);
        }

        .comment-item .comment-actions .delete {
            color: var(--danger);
            opacity: 0.5;
        }

        .comment-item .comment-actions .delete:hover {
            opacity: 1;
        }

        .comment-children {
            margin-left: 20px;
            padding-left: 12px;
            border-left: 2px solid rgba(255, 255, 255, 0.06);
        }

        .empty-comments {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== КАРТОЧКА ИДЕЙ ===== */
        .card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(108, 92, 231, 0.2);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-author {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-author img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-author .user {
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .card-author .user:hover {
            color: var(--accent);
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .card-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .card-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-actions button:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .card-actions .del {
            color: var(--danger);
            opacity: 0.5;
        }

        .card-actions .del:hover {
            opacity: 1;
            background: rgba(255, 107, 107, 0.1);
        }

        .card-actions .run {
            color: var(--success);
            opacity: 0.7;
        }

        .card-actions .run:hover {
            opacity: 1;
            background: rgba(81, 207, 102, 0.1);
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .tag.active {
            background: var(--accent);
            color: #fff;
        }

        .tag:hover {
            border-color: var(--accent);
        }

        .code-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 8px;
            background: rgba(81, 207, 102, 0.15);
            color: var(--success);
            border: 1px solid rgba(81, 207, 102, 0.2);
            margin-bottom: 8px;
        }

        /* ===== КНОПКИ ДЕЙСТВИЙ ===== */
        .edit-btn,
        .delete-btn {
            background: transparent;
            border: none;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
        }

        .edit-btn {
            color: var(--accent);
            opacity: 0.6;
        }

        .edit-btn:hover {
            opacity: 1;
            background: rgba(108, 92, 231, 0.1);
        }

        .delete-btn {
            color: var(--danger);
            opacity: 0.5;
        }

        .delete-btn:hover {
            opacity: 1;
            background: rgba(255, 107, 107, 0.1);
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-header {
            text-align: center;
            padding: 20px 0;
        }

        .profile-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
        }

        .profile-user {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .profile-stats {
            display: flex;
            justify-content: center;

    <script>
        // ============================================================

        // ============================================================

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyC79WgSLxHlno3fqcQcyxw0hvryuQIQKXI",
            authDomain: "xgame-66690.firebaseapp.com",
            projectId: "xgame-66690",
            storageBucket: "xgame-66690.firebasestorage.app",
            messagingSenderId: "628360447691",
            appId: "1:628360447691:web:ac2ee8ecc8c9652cf4fd4e"
        };

        const XAM_CLIENT_ID = 'xam_QshD84Eivo13l1t4vQLFUew';
        const XAM_REDIRECT_URI = 'https://jsksosplals.github.io/Xgame/';

        const STORAGE_KEY = 'xgame_user';
        const STATE_KEY = 'xgame_oauth_state';
        const PKCE_KEY = 'xgame_pkce_verifier';
        const MAX_TITLE_LENGTH = 40;
        const MAX_REACTIONS = 3;

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ FIREBASE
        // ============================================================

        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.firestore();

        // ============================================================
        // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        // ============================================================

        const state = {
            user: null,
            posts: [],
            ideas: [],
            currentPage: 'ideas',
            filter: 'all',
            search: '',
            searchPosts: '',
            replyTo: null,
        };

        // ============================================================
        // УТИЛИТЫ
        // ============================================================

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'Только что';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' мин назад';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' ч назад';

            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 10);
        }

        function getCurrentUser() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        function setCurrentUser(user) {
            if (user) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
                state.user = user;
            } else {
                localStorage.removeItem(STORAGE_KEY);
                state.user = null;
            }
        }

        // ============================================================
        // УВЕДОМЛЕНИЯ (TOAST)
        // ============================================================

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================================
        // АВТОРИЗАЦИЯ (OAuth 2.0 + PKCE)
        // ============================================================

        async function generatePKCE() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            const verifier = Array.from(array)
                .map(b => String.fromCharCode(b))
                .join('');

            const encoder = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', encoder.encode(verifier));
            const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            return { verifier, challenge };
        }

        function startAuth() {
            const state = Math.random().toString(36).substring(7);
            sessionStorage.setItem(STATE_KEY, state);

            generatePKCE().then(({ verifier, challenge }) => {
                sessionStorage.setItem(PKCE_KEY, verifier);

                const params = new URLSearchParams({
                    client_id: XAM_CLIENT_ID,
                    redirect_uri: XAM_REDIRECT_URI,
                    response_type: 'code',
                    scope: 'profile_basic',
                    state: state,
                    code_challenge: challenge,
                    code_challenge_method: 'S256'
                });

                window.location.href = 'https://xamchat.ru/oauth/authorize?' + params.toString();
            }).catch(err => {
                console.error('PKCE generation failed:', err);
                showToast('Ошибка инициализации входа', 'error');
            });
        }

        async function exchangeCode(code, verifier) {
            const response = await fetch('https://xamchat.ru/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    grant_type: 'authorization_code',
                    code: code,
                    client_id: XAM_CLIENT_ID,
                    redirect_uri: XAM_REDIRECT_URI,
                    code_verifier: verifier
                })
            });

            if (!response.ok) {
                throw new Error('Token exchange failed');
            }

            return response.json();
        }

        async function getUserInfo(accessToken) {
            const response = await fetch('https://xamchat.ru/oauth/userinfo', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });

            if (!response.ok) {
                throw new Error('Failed to get user info');
            }

            return response.json();
        }

        async function handleAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const savedState = sessionStorage.getItem(STATE_KEY);

            if (!code || !state || state !== savedState) return;

            sessionStorage.removeItem(STATE_KEY);
            const verifier = sessionStorage.getItem(PKCE_KEY);
            sessionStorage.removeItem(PKCE_KEY);

            try {
                const tokenData = await exchangeCode(code, verifier);
                const userData = await getUserInfo(tokenData.access_token);

                // Сохраняем пользователя в Firestore
                const userRef = db.collection('users').doc(userData.username);
                await userRef.set({
                    username: userData.username,
                    name: userData.name || userData.username,
                    avatar_url: userData.avatar_url || '',
                    xamchat_id: userData.id || userData.username,
                    lastLogin: Date.now()
                }, { merge: true });

                const user = {
                    id: userData.username,
                    username: userData.username,
                    name: userData.name || userData.username,
                    avatar_url: userData.avatar_url || '',
                    access_token: tokenData.access_token
                };

                setCurrentUser(user);
                window.history.replaceState({}, document.title, window.location.pathname);
                showMain();
                await loadAll();
                showToast('✅ Добро пожаловать, ' + user.name + '!', 'success');
            } catch (error) {
                console.error('Auth error:', error);
                document.getElementById('authError').textContent = '⚠️ Ошибка авторизации. Попробуйте снова.';
                document.getElementById('authError').classList.add('visible');
                showToast('Ошибка авторизации', 'error');
            }
        }

        // ============================================================
        // UI УПРАВЛЕНИЕ
        // ============================================================

        function showMain() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            updateProfileUI();
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        function updateProfileUI() {
            const user = getCurrentUser();
            if (!user) return;

            document.getElementById('profileName').textContent = user.name || user.username;
            document.getElementById('profileUser').textContent = '@' + user.username;

            const placeholder = document.getElementById('avatarPlaceholder');
            const profileAvatar = document.getElementById('profileAvatar');

            if (user.avatar_url) {
                const img = `<img src="${escapeHTML(user.avatar_url)}">`;
                placeholder.innerHTML = img;
                profileAvatar.innerHTML = img;
            } else {
                placeholder.textContent = user.name?.charAt(0) || '👤';
                profileAvatar.innerHTML = '👤';
            }
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                setCurrentUser(null);
                showAuth();
                showToast('👋 До встречи!', 'info');
            }
        }

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ
        // ============================================================

        async function loadAll() {
            try {
                await Promise.all([loadIdeas(), loadPosts()]);
                updateStats();
            } catch (error) {
                console.error('Load error:', error);
                showToast('Ошибка загрузки данных', 'error');
            }
        }

        async function loadIdeas() {
            try {
                let query = db.collection('ideas').orderBy('created_at', 'desc');

                if (state.filter !== 'all') {
                    query = query.where('genre', '==', state.filter);
                }

                if (state.search) {
                    const searchTerm = state.search.toLowerCase().trim();
                    // Простой поиск через Firebase (ограниченный)
                    query = query.where('title', '>=', searchTerm).where('title', '<=', searchTerm + '\uf8ff');
                }

                const snapshot = await query.get();
                state.ideas = [];
                snapshot.forEach(doc => {
                    state.ideas.push({ id: doc.id, ...doc.data() });
                });

                renderIdeas();
                renderFilters();
            } catch (error) {
                console.error('Load ideas error:', error);
                // Если ошибка поиска, загружаем без фильтра
                if (state.search) {
                    state.search = '';
                    await loadIdeas();
                } else {
                    showToast('Ошибка загрузки идей', 'error');

        window.handleReaction = async function(postId, type) {
            const user = getCurrentUser();
            if (!user) {
                showToast('Авторизуйтесь, чтобы ставить реакции', 'error');
                return;
            }

            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            if (!post.reactions) post.reactions = {};
            if (!post.userReactions) post.userReactions = {};

            const currentCount = Object.values(post.userReactions).filter(Boolean).length;

            // Если реакция уже стоит — убираем
            if (post.userReactions[type]) {
                post.reactions[type] = Math.max(0, (post.reactions[type] || 1) - 1);
                post.userReactions[type] = false;
                updateReactionUI(postId);

                try {
                    await db.collection('posts').doc(postId).update({
                        reactions: post.reactions,
                        userReactions: post.userReactions
                    });
                } catch (error) {
                    console.error('Update reaction error:', error);
                    // Откат UI
                    post.reactions[type] = (post.reactions[type] || 0) + 1;
                    post.userReactions[type] = true;
                    updateReactionUI(postId);
                    showToast('Ошибка обновления', 'error');
                }
                return;
            }

            // Проверка лимита
            if (currentCount >= MAX_REACTIONS) {
                const btn = document.querySelector(`.reaction-btn[data-post-id="${postId}"][data-reaction="${type}"]`);
                if (btn) {
                    btn.classList.add('shake');
                    setTimeout(() => btn.classList.remove('shake'), 400);
                }
                showToast(`❌ Можно поставить только ${MAX_REACTIONS} реакции на пост`, 'error');
                return;
            }

            // Добавляем реакцию
            post.reactions[type] = (post.reactions[type] || 0) + 1;
            post.userReactions[type] = true;
            updateReactionUI(postId);

            try {
                await db.collection('posts').doc(postId).update({
                    reactions: post.reactions,
                    userReactions: post.userReactions
                });
            } catch (error) {
                console.error('Update reaction error:', error);
                // Откат UI
                post.reactions[type] = Math.max(0, (post.reactions[type] || 1) - 1);
                post.userReactions[type] = false;
                updateReactionUI(postId);
                showToast('Ошибка обновления', 'error');
            }
        };

        function updateReactionUI(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            // Обновляем счётчики
            Object.keys(post.reactions).forEach(type => {
                const el = document.getElementById(`reaction-count-${postId}-${type}`);
                if (el) el.textContent = post.reactions[type] || 0;
            });

            // Обновляем активные состояния
            document.querySelectorAll(`.reaction-btn[data-post-id="${postId}"]`).forEach(btn => {
                const type = btn.dataset.reaction;
                btn.classList.toggle('active', post.userReactions[type] || false);
            });

            // Обновляем лимит
            const limitEl = document.getElementById(`reaction-limit-${postId}`);
            if (limitEl) {
                const count = Object.values(post.userReactions).filter(Boolean).length;
                limitEl.textContent = `${count}/${MAX_REACTIONS}`;
            }
        }

        window.toggleComments = function(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            if (!section) return;

            const isHidden = section.style.display === 'none' || !section.style.display;
            section.style.display = isHidden ? 'block' : 'none';

            if (isHidden) {
                loadComments(postId);
                // Фокус на поле ввода
                const input = document.getElementById(`comment-input-${postId}`);
                if (input) setTimeout(() => input.focus(), 300);
            }
        };

        async function loadComments(postId) {
            try {
                const snapshot = await db.collection('comments')
                    .where('post_id', '==', postId)
                    .orderBy('created_at', 'asc')
                    .get();

                const comments = [];
                snapshot.forEach(doc => comments.push({ id: doc.id, ...doc.data() }));

                // Строим дерево комментариев
                const map = {};
                const roots = [];

                comments.forEach(c => {
                    map[c.id] = { ...c, replies: [] };
                });

                comments.forEach(c => {
                    if (c.parent_id && map[c.parent_id]) {
                        map[c.parent_id].replies.push(map[c.id]);
                    } else {
                        roots.push(map[c.id]);
                    }
                });

                renderCommentsForPost(postId, roots);
            } catch (error) {
                console.error('Load comments error:', error);
                showToast('Ошибка загрузки комментариев', 'error');
            }
        }

        function renderCommentsForPost(postId, comments) {
            const container = document.getElementById(`comments-container-${postId}`);
            if (!container) return;

            const user = getCurrentUser();

            if (!comments || comments.length === 0) {
                container.innerHTML = '<div class="empty-comments">Пока нет комментариев.</div>';
                updateCommentCount(postId, 0);
                return;
            }

            function renderTree(items, level = 0) {
                let html = '';
                items.forEach(c => {
                    const isAuthor = user && c.author_id === user.id;
                    const avatar = c.author?.avatar_url || '';

                    html += `
                        <div class="comment-item" style="margin-left:${level * 20}px;">
                            <div class="comment-header">
                                <img src="${avatar}" onerror="this.style.display='none'">
                                <span class="name">${escapeHTML(c.author?.name || c.author?.username)}</span>
                                <span class="username">@${escapeHTML(c.author?.username)}</span>
                                <span class="date">${formatDate(c.created_at)}</span>
                            </div>
                            <div class="comment-body">${escapeHTML(c.content)}</div>
                            <div class="comment-actions">
                                <button onclick="replyToComment('${c.id}', '${postId}', '${escapeHTML(c.author?.name)}')">↩ Ответить</button>
                                ${isAuthor ? `<button class="delete" onclick="deleteComment('${c.id}', '${postId}')">🗑 Удалить</button>` : ''}
                            </div>
                            ${c.replies && c.replies.length > 0 ? renderTree(c.replies, level + 1) : ''}
                        </div>
                    `;
                });
                return html;
            }

            container.innerHTML = renderTree(comments);
            updateCommentCount(postId, comments.length);
        }

        function updateCommentCount(postId, count) {
            const badge = document.getElementById(`comments-badge-${postId}`);
            const label = document.getElementById(`comments-count-${postId}`);

            if (badge) badge.textContent = count;

            state.replyTo = { commentId, postId, name };

        window.submitComment = async function(postId) {
            const user = getCurrentUser();
            if (!user) {
                showToast('Авторизуйтесь, чтобы комментировать', 'error');
                return;
            }

            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();

            if (!content) {
                showToast('Введите текст комментария', 'error');
                return;
            }

            const parentId = state.replyTo?.postId === postId ? state.replyTo.commentId : null;

            try {
                const docRef = await db.collection('comments').add({
                    post_id: postId,
                    content: content,
                    parent_id: parentId || null,
                    author_id: user.id,
                    author: {
                        username: user.username,
                        name: user.name || user.username,
                        avatar_url: user.avatar_url || ''
                    },
                    created_at: Date.now()
                });

                // Обновляем счётчик комментариев в посте
                const post = state.posts.find(p => p.id === postId);
                if (post) {
                    post.comments_count = (post.comments_count || 0) + 1;
                    await db.collection('posts').doc(postId).update({
                        comments_count: post.comments_count
                    });
                }

                input.value = '';
                input.placeholder = 'Написать комментарий...';
                state.replyTo = null;

                await loadComments(postId);
                renderPosts();
                showToast('✅ Комментарий добавлен!', 'success');
            } catch (error) {
                console.error('Submit comment error:', error);
                showToast('Ошибка отправки комментария', 'error');
            }
        };

        window.deleteComment = async function(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;

            try {
                await db.collection('comments').doc(commentId).delete();

                // Обновляем счётчик
                const post = state.posts.find(p => p.id === postId);
                if (post) {
                    post.comments_count = Math.max(0, (post.comments_count || 0) - 1);
                    await db.collection('posts').doc(postId).update({
                        comments_count: post.comments_count
                    });
                }

                await loadComments(postId);
                renderPosts();
                showToast('🗑 Комментарий удалён', 'info');

                console.error('Delete comment error:', error);
                showToast('Ошибка удаления', 'error');

        window.runSandbox = function(id) {
            const idea = state.ideas.find(i => i.id === id);
            if (!idea || !idea.code) {
                showToast('Код не найден', 'error');
                return;
            }

            const overlay = document.getElementById('sandboxOverlay');
            const frame = document.getElementById('sandboxFrame');
            document.getElementById('sandboxTitle').textContent = idea.title || 'Проект';

            overlay.classList.add('active');

            let code = idea.code;
            // Если код не является полным HTML-документом, оборачиваем
            if (!code.includes('<html') && !code.includes('<!DOCTYPE')) {
                code = `<!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                </head>
                <body>${code}</body>
                </html>`;
            }

            frame.srcdoc = code;
        };

                const commentsSnapshot = await db.collection('comments')
                    .where('post_id', '==', id)

                await loadPosts();
                updateStats();

        // ============================================================

        document.getElementById('fabBtn').addEventListener('click', function() {
            const activePage = document.querySelector('.page.active');
            if (!activePage) return;

            if (activePage.id === 'page-ideas') {
                document.getElementById('ideaModal').classList.add('active');
                document.getElementById('ideaTitle').value = '';
                document.getElementById('ideaDesc').value = '';
                document.getElementById('ideaGenre').value = '';
                document.getElementById('ideaCode').value = '';
            } else if (activePage.id === 'page-posts') {
                document.getElementById('postModal').classList.add('active');
                document.getElementById('postTitle').value = '';
                document.getElementById('postText').value = '';
                document.getElementById('postImage').value = '';
            } else {
                showToast('Создание доступно в разделах "Идеи" и "Посты"', 'info');
            }
        });

        // Модалка поста
        document.getElementById('postCancel').addEventListener('click', function() {
            document.getElementById('postModal').classList.remove('active');
        });

        document.getElementById('postSave').addEventListener('click', async function() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postText').value.trim();
            const image = document.getElementById('postImage').value.trim();

            if (!title || !content) {
                showToast('Заполните заголовок и текст', 'error');
                return;
            }

            await createPost(title, content, image);
            document.getElementById('postModal').classList.remove('active');
        });

        // Модалка идеи
        document.getElementById('ideaCancel').addEventListener('click', function() {
            document.getElementById('ideaModal').classList.remove('active');
        });

        document.getElementById('ideaSave').addEventListener('click', async function() {
            const title = document.getElementById('ideaTitle').value.trim();
            const description = document.getElementById('ideaDesc').value.trim();
            const genre = document.getElementById('ideaGenre').value;
            const code = document.getElementById('ideaCode').value.trim();

            if (!title || !description) {
                showToast('Заполните название и описание', 'error');
                return;
            }

            await createIdea(title, description, genre, code);
            document.getElementById('ideaModal').classList.remove('active');
        });

        // ============================================================
        // ПОИСК
        // ============================================================

        document.getElementById('searchBtn').addEventListener('click', function() {
            state.search = document.getElementById('searchInput').value.trim();
            loadIdeas();
        });

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        document.getElementById('searchPostsBtn').addEventListener('click', function() {
            state.searchPosts = document.getElementById('searchPostsInput').value.trim();
            renderPosts();
        });

        document.getElementById('searchPostsInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchPostsBtn').click();
            }
        });

        // ============================================================
        // НАВИГАЦИЯ
        // ============================================================

        document.querySelectorAll('.nav button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

                const page = this.dataset.page;
                document.getElementById(`page-${page}`).classList.add('active');
                state.currentPage = page;

                const fab = document.getElementById('fabBtn');
                fab.classList.toggle('hidden', page === 'profile' || page === 'about');
            });
        });

        document.getElementById('avatarBtn').addEventListener('click', function() {
            document.querySelector('[data-page="profile"]').click();
        });

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // ============================================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // ============================================================

        async function init() {
            // Обработка возврата из XAMChat
            await handleAuthCallback();

            // Проверка сохранённой сессии
            const user = getCurrentUser();
            if (user) {
                showMain();
                await loadAll();
            } else {
                showAuth();
            }

            // Обработчик кнопки входа
            document.getElementById('authBtn').addEventListener('click', startAuth);

            console.log('🚀 Xgame v2.0 (Professional)');
            console.log('📱 Полная версия сайта с реакциями и комментариями');
            console.log('🔒 PKCE + OAuth 2.0');
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
